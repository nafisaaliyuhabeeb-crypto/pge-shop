<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PGE Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--primary:#FFB800;--primary-2:#FFD644;--primary-3:#F59E0B;
--dark:#0A0F1F;--dark-2:#131A2E;--dark-3:#1E293B;
--text:#0F172A;--muted:#64748B;--muted-2:#94A3B8;
--bg:#F4F6FA;--surface:#FFFFFF;--border:#E5E9F0;--border-2:#EDF1F7;
--success:#10B981;--danger:#EF4444;--accent:#6366F1;
--shadow-sm:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.06);
--shadow-md:0 4px 12px rgba(15,23,42,.06),0 2px 6px rgba(15,23,42,.04);
--shadow-lg:0 12px 32px rgba(15,23,42,.10),0 4px 12px rgba(15,23,42,.06);
--shadow-glow:0 8px 24px rgba(255,184,0,.35);
--r-sm:10px;--r-md:14px;--r-lg:20px;--r-xl:24px;
--ease-spring:cubic-bezier(.34,1.56,.64,1);--ease-out:cubic-bezier(.16,1,.3,1)
}
html{-webkit-text-size-adjust:100%}
body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:20px;line-height:1.5;font-size:14px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
button{border:0;cursor:pointer;background:none}
input,select,textarea{-webkit-appearance:none;appearance:none}

#authOverlay{position:fixed;inset:0;background:linear-gradient(160deg,#0A0F1F 0%,#131A2E 45%,#1E1B4B 100%);z-index:10000;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px;overflow:hidden}
#authOverlay::before{content:"";position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(255,184,0,.4),transparent 70%);top:-100px;right:-100px;filter:blur(40px);pointer-events:none;z-index:0}
#authOverlay::after{content:"";position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,.35),transparent 70%);bottom:-100px;left:-100px;filter:blur(40px);pointer-events:none;z-index:0}
.auth-card{position:relative;z-index:1;background:rgba(255,255,255,.98);backdrop-filter:blur(24px);padding:32px 24px 28px;border-radius:24px;box-shadow:0 24px 64px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.08);width:100%;max-width:380px;text-align:center;animation:authIn .6s var(--ease-out)}
@keyframes authIn{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.auth-logo{width:64px;height:64px;margin:0 auto 16px;border-radius:20px;background:linear-gradient(135deg,#FFD644,#FFB800);display:flex;align-items:center;justify-content:center;color:#0A0F1F;font-size:26px;box-shadow:var(--shadow-glow);animation:logoSpin 3s ease-in-out infinite}
@keyframes logoSpin{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(2deg) scale(1.03)}}
.auth-card h2{font-size:19px;font-weight:800;letter-spacing:-.3px;margin-bottom:6px}
.auth-card p{font-size:12px;color:var(--muted);margin-bottom:22px}
.auth-field{position:relative;margin-bottom:12px;text-align:left}
.auth-field i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted-2);font-size:13px;pointer-events:none}
.auth-field input{width:100%;padding:14px 14px 14px 40px;border:1.5px solid var(--border);border-radius:14px;font-size:13.5px;background:#F8FAFC;transition:border-color .2s,background .2s}
.auth-field input:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(255,184,0,.15)}
.auth-btn{width:100%;padding:14px;background:linear-gradient(135deg,#FFD644,#FFB800);color:#0A0F1F;border-radius:14px;font-weight:800;font-size:14px;transition:transform .15s var(--ease-spring),box-shadow .2s;box-shadow:var(--shadow-glow);margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px}
.auth-btn:active{transform:scale(.97)}
.auth-error{background:rgba(239,68,68,.1);color:var(--danger);font-size:12px;padding:10px;border-radius:10px;margin-top:12px;font-weight:600;display:none;text-align:center}
.auth-error.show{display:block}

.admin-header{position:sticky;top:0;z-index:100;background:rgba(10,15,31,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06);padding:14px 16px}
.admin-header-inner{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.admin-title{display:flex;align-items:center;gap:10px;color:#fff}
.admin-title-icon{width:38px;height:38px;background:linear-gradient(135deg,#FFD644,#FFB800);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#0A0F1F;font-size:16px;box-shadow:0 6px 16px rgba(255,184,0,.4)}
.admin-title h1{font-size:15px;font-weight:800;letter-spacing:-.2px;line-height:1.2}
.admin-title span{font-size:10px;color:rgba(255,255,255,.5);display:block;margin-top:2px;font-weight:500}
.admin-tools{display:flex;gap:6px;flex-wrap:wrap}
.tool-btn{padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.08);color:#fff;font-weight:600;font-size:11px;display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.08);transition:background .15s,transform .15s}
.tool-btn:active{transform:scale(.96);background:rgba(255,255,255,.15)}
.tool-btn i{color:var(--primary-2);font-size:12px}

main{max-width:960px;margin:0 auto;padding:20px 16px 40px}
.section{background:var(--surface);border-radius:var(--r-xl);padding:20px;margin-bottom:16px;box-shadow:var(--shadow-md);border:1px solid var(--border-2);animation:fadeUp .4s var(--ease-out) backwards}
.section:nth-child(1){animation-delay:.02s}
.section:nth-child(2){animation-delay:.06s}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.section-head h2{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;letter-spacing:-.2px}
.section-head h2 i{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,#FFF7E6,#FFEFC2);color:var(--primary-3);display:flex;align-items:center;justify-content:center;font-size:12px}
.count-pill{background:#EEF2F7;color:var(--muted);font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:20px}

.btn{padding:10px 16px;border-radius:12px;font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;gap:7px;transition:transform .15s var(--ease-spring),box-shadow .2s,background .15s;cursor:pointer}
.btn:active{transform:scale(.95)}
.btn-primary{background:linear-gradient(135deg,#FFD644,#FFB800);color:#0A0F1F;box-shadow:0 6px 16px rgba(255,184,0,.35)}
.btn-success{background:linear-gradient(135deg,#34D399,#10B981);color:#fff;box-shadow:0 6px 16px rgba(16,185,129,.3)}
.btn-icon{width:36px;height:36px;padding:0;justify-content:center;border-radius:11px;background:#F1F5F9;color:var(--muted);transition:background .15s,color .15s,transform .15s}
.btn-icon:hover{background:#E2E8F0}
.btn-icon.danger{background:rgba(239,68,68,.08);color:var(--danger)}
.btn-icon.danger:hover{background:rgba(239,68,68,.15)}

.item-list{display:flex;flex-direction:column;gap:10px}
.item-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:#FAFBFD;border:1.5px solid var(--border-2);transition:box-shadow .2s,transform .2s,border-color .2s;touch-action:pan-y;position:relative;user-select:none;-webkit-user-select:none}
.item-row:hover{border-color:var(--border);box-shadow:var(--shadow-sm)}
.item-row.dragging{box-shadow:var(--shadow-lg);border-color:var(--primary);background:#fff;cursor:grabbing;transition:none}
.drag-handle{width:36px;height:44px;display:flex;align-items:center;justify-content:center;cursor:grab;border-radius:10px;color:var(--muted-2);font-size:14px;touch-action:none;transition:background .15s,color .15s;flex-shrink:0}
.drag-handle:hover{background:#EEF2F7;color:var(--dark)}
.drag-handle:active{cursor:grabbing;background:#E5E9F0}
.position-num{position:absolute;top:6px;right:6px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:linear-gradient(135deg,#FFD644,#FFB800);color:#0A0F1F;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(255,184,0,.4)}
.item-thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;background:#EEF2F7;flex-shrink:0;box-shadow:var(--shadow-sm)}
.item-info{flex:1;min-width:0}
.item-title{font-size:13px;font-weight:700;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.item-sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.item-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:8px;background:#EEF2F7;color:var(--muted);letter-spacing:.2px}
.chip.gold{background:linear-gradient(135deg,#FFF7E6,#FFEFC2);color:var(--primary-3)}
.chip.success{background:rgba(16,185,129,.12);color:var(--success)}
.chip.danger{background:rgba(239,68,68,.1);color:var(--danger)}
.item-actions{display:flex;gap:6px;flex-shrink:0}

.empty{padding:32px 16px;text-align:center;color:var(--muted);background:#FAFBFD;border-radius:16px;border:1.5px dashed var(--border)}
.empty i{font-size:34px;color:#CBD5E1;margin-bottom:8px;display:block}
.empty p{font-size:12.5px;font-weight:600}

.modal{position:fixed;inset:0;background:rgba(10,15,31,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:1000;display:none;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:640px){.modal{align-items:center;padding:20px}}
.modal.show{display:flex;animation:fadeIn .25s var(--ease-out)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-card{background:var(--surface);width:100%;max-width:540px;max-height:92vh;overflow-y:auto;padding:22px 20px 26px;border-radius:24px 24px 0 0;position:relative;animation:slideUpSheet .4s var(--ease-out);box-shadow:0 -10px 40px rgba(0,0,0,.2);-webkit-overflow-scrolling:touch}
@media(min-width:640px){.modal-card{border-radius:24px;animation:modalIn .35s var(--ease-spring)}}
@keyframes slideUpSheet{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes modalIn{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.modal-grabber{width:40px;height:4px;background:#E5E9F0;border-radius:2px;margin:0 auto 14px}
@media(min-width:640px){.modal-grabber{display:none}}
.modal-card h3{font-size:17px;font-weight:800;margin-bottom:16px;letter-spacing:-.3px}
.modal-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:#F1F5F9;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:14px;transition:background .15s;z-index:10}
.modal-close:hover{background:#E2E8F0;color:var(--dark)}

.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.2px;text-transform:uppercase}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;font-size:13.5px;background:#FAFBFD;color:var(--text);transition:border-color .2s,background .2s,box-shadow .2s;font-weight:500}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(255,184,0,.13)}
.form-group textarea{resize:vertical;min-height:70px;font-family:inherit}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.form-row{grid-template-columns:1fr}}
.file-input-wrap{position:relative}
.file-input-wrap input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:2}
.file-input-btn{display:flex;align-items:center;gap:10px;padding:14px;border:1.5px dashed var(--border);border-radius:12px;background:#FAFBFD;color:var(--muted);font-size:12.5px;font-weight:600;transition:border-color .15s,background .15s}
.file-input-wrap:hover .file-input-btn{border-color:var(--primary);background:#FFFBF0;color:var(--dark)}
.file-input-btn i{color:var(--primary-3);font-size:15px}
.thumb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px;margin-top:10px}
.thumb{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:#EEF2F7;border:1.5px solid var(--border-2);box-shadow:var(--shadow-sm)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .rm{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(239,68,68,.92);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.thumb .badge{position:absolute;bottom:4px;left:4px;background:linear-gradient(135deg,#FFD644,#FFB800);color:#0A0F1F;font-size:8px;font-weight:800;padding:2px 6px;border-radius:6px;letter-spacing:.3px}
.checkbox-group{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#FAFBFD;border:1.5px solid var(--border);border-radius:12px;cursor:pointer;transition:border-color .15s,background .15s}
.checkbox-group:hover{border-color:var(--danger);background:#FEF6F6}
.checkbox-group input{width:20px;height:20px;accent-color:var(--danger);cursor:pointer}
.checkbox-group label{margin:0;text-transform:none;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;letter-spacing:0}
.submit-btn{width:100%;padding:14px;justify-content:center;margin-top:6px;font-size:14px}

.progress-overlay{position:fixed;inset:0;background:rgba(10,15,31,.75);backdrop-filter:blur(8px);z-index:3000;display:none;align-items:center;justify-content:center;padding:20px}
.progress-overlay.show{display:flex;animation:fadeIn .2s}
.progress-card{background:#fff;padding:28px 22px;border-radius:22px;max-width:340px;width:100%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.progress-card .icon{width:56px;height:56px;margin:0 auto 14px;border-radius:18px;background:linear-gradient(135deg,#FFF7E6,#FFEFC2);color:var(--primary-3);display:flex;align-items:center;justify-content:center;font-size:22px}
.progress-card h4{font-size:15px;font-weight:800;margin-bottom:6px}
.progress-card p{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.4}
.progress-bar{height:6px;background:#EEF2F7;border-radius:3px;overflow:hidden;margin-bottom:10px}
.progress-bar>div{height:100%;background:linear-gradient(90deg,#FFD644,#FFB800);width:0%;transition:width .3s ease;border-radius:3px}
.progress-status{font-size:11px;color:var(--muted);font-weight:600}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(10,15,31,.96);backdrop-filter:blur(16px);color:#fff;padding:12px 20px;border-radius:14px;font-weight:600;font-size:12.5px;z-index:9999;opacity:0;pointer-events:none;box-shadow:0 12px 32px rgba(0,0,0,.35);transition:all .35s var(--ease-out);max-width:90%;text-align:center;border:1px solid rgba(255,255,255,.08)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}

.skel{background:linear-gradient(90deg,#EEF2F7 0%,#F8FAFC 50%,#EEF2F7 100%);background-size:200% 100%;animation:sk 1.4s infinite;border-radius:10px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.skel-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:#FAFBFD;border:1.5px solid var(--border-2)}
.skel-thumb{width:56px;height:56px;border-radius:12px;flex-shrink:0}
.skel-lines{flex:1;display:flex;flex-direction:column;gap:8px}
.skel-line{height:12px}
.skel-line.w70{width:70%}
.skel-line.w40{width:40%}
</style>
</head>
<body>

<div id="authOverlay">
<div class="auth-card">
<div class="auth-logo"><i class="fa-solid fa-crown"></i></div>
<h2>PGE Admin</h2>
<p>Sign in to manage your store</p>
<div class="auth-field">
<i class="fa-solid fa-lock"></i>
<input type="password" id="adminPasswordInput" placeholder="Password" autocomplete="current-password">
</div>
<div class="auth-field">
<i class="fa-solid fa-key"></i>
<input type="password" id="tokenInput" placeholder="GitHub token" autocomplete="off">
</div>
<button class="auth-btn" onclick="verifyAdmin()"><i class="fa-solid fa-unlock"></i> Unlock Dashboard</button>
<div id="authErrorMsg" class="auth-error"></div>
</div>
</div>

<header class="admin-header">
<div class="admin-header-inner">
<div class="admin-title">
<div class="admin-title-icon"><i class="fa-solid fa-crown"></i></div>
<div>
<h1>PGE Admin</h1>
<span>Content Manager</span>
</div>
</div>
<div class="admin-tools">
<button class="tool-btn" onclick="exportData()"><i class="fa-solid fa-download"></i> Export</button>
<button class="tool-btn" onclick="importData()"><i class="fa-solid fa-upload"></i> Import</button>
<button class="tool-btn" onclick="changeToken()"><i class="fa-solid fa-key"></i> Token</button>
<a class="tool-btn" href="index.html" target="_blank"><i class="fa-solid fa-eye"></i> View</a>
</div>
</div>
</header>

<main>

<section class="section">
<div class="section-head">
<h2><i class="fa-solid fa-image"></i> Banners <span class="count-pill" id="bannerCount">0</span></h2>
<button class="btn btn-primary" onclick="openBannerModal()"><i class="fa-solid fa-plus"></i> Add Banner</button>
</div>
<p style="font-size:11px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:6px;">
<i class="fa-solid fa-hand-pointer" style="color:var(--primary-3)"></i> Press and hold <i class="fa-solid fa-grip-vertical"></i> to reorder — #1 plays first
</p>
<div id="bannerList" class="item-list">
<div class="skel-row"><div class="skel skel-thumb"></div><div class="skel-lines"><div class="skel skel-line w70"></div><div class="skel skel-line w40"></div></div></div>
<div class="skel-row"><div class="skel skel-thumb"></div><div class="skel-lines"><div class="skel skel-line w70"></div><div class="skel skel-line w40"></div></div></div>
</div>
</section>

<section class="section">
<div class="section-head">
<h2><i class="fa-solid fa-box"></i> Products <span class="count-pill" id="productCount">0</span></h2>
<button class="btn btn-primary" onclick="openProductModal()"><i class="fa-solid fa-plus"></i> Add Product</button>
</div>
<div id="productList" class="item-list">
<div class="skel-row"><div class="skel skel-thumb"></div><div class="skel-lines"><div class="skel skel-line w70"></div><div class="skel skel-line w40"></div></div></div>
<div class="skel-row"><div class="skel skel-thumb"></div><div class="skel-lines"><div class="skel skel-line w70"></div><div class="skel skel-line w40"></div></div></div>
</div>
</section>

</main>

<div id="bannerModal" class="modal">
<div class="modal-card">
<div class="modal-grabber"></div>
<button class="modal-close" onclick="closeModal('bannerModal')"><i class="fa-solid fa-xmark"></i></button>
<h3 id="bannerModalTitle">Add Banner</h3>
<form id="bannerForm" onsubmit="saveBanner(event)">
<input type="hidden" id="bannerEditId">
<input type="hidden" id="bannerImageUrl">
<div class="form-group">
<label>Banner Image</label>
<div class="file-input-wrap">
<input type="file" id="bannerFile" accept="image/*" onchange="previewImage(this,'bannerPreview','bannerImageUrl')">
<div class="file-input-btn"><i class="fa-solid fa-cloud-arrow-up"></i> <span id="bannerFileLabel">Tap to choose image</span></div>
</div>
<img id="bannerPreview" style="max-width:100%;max-height:120px;object-fit:cover;border-radius:12px;margin-top:10px;display:none" alt="">
</div>
<div class="form-group"><label>Or image URL</label><input type="url" id="bannerImageAlt" placeholder="https://..." oninput="document.getElementById('bannerImageUrl').value=this.value;var p=document.getElementById('bannerPreview');p.src=this.value;p.style.display=this.value?'block':'none'"></div>
<div class="form-group"><label>Label</label><input type="text" id="bannerLabel" placeholder="e.g. Flash Sale"></div>
<div class="form-group"><label>Title</label><input type="text" id="bannerTitle" placeholder="e.g. Upgrade Your Lifestyle"></div>
<div class="form-group"><label>Description</label><input type="text" id="bannerDesc" placeholder="Short subtitle"></div>
<div class="form-row">
<div class="form-group"><label>Button Text</label><input type="text" id="bannerBtnText" placeholder="Shop Now"></div>

<script>
/* ============ CONFIG ============ */
const GH_USER='nafisaaliyuhabeeb-crypto';
const GH_REPO='pge-shop';
const GH_BRANCH='main';
const API_BASE='https://api.github.com/repos/'+GH_USER+'/'+GH_REPO+'/contents';
const RAW_BASE='https://raw.githubusercontent.com/'+GH_USER+'/'+GH_REPO+'/'+GH_BRANCH;

function getToken(){return localStorage.getItem('pge_github_token')||''}
function setToken(t){localStorage.setItem('pge_github_token',t)}
function changeToken(){
  const cur=getToken()?'(saved)':'(none)';
  const t=prompt('Current token '+cur+'. Paste a new one (or Cancel):','');
  if(t===null)return;
  if(t.trim()){setToken(t.trim());toast('Token updated!')}
}

/* ============ AUTH ============ */
const PASS='admin5677*#*#@';
const LOCK_MS=180000;
let unlocked=false,lockT;

function verifyAdmin(){
  const p=document.getElementById('adminPasswordInput').value;
  const t=document.getElementById('tokenInput').value.trim();
  const err=document.getElementById('authErrorMsg');
  if(p!==PASS){err.textContent='Incorrect password';err.classList.add('show');return}
  if(t)setToken(t);
  if(!getToken()){err.textContent='Please paste your GitHub token';err.classList.add('show');return}
  document.getElementById('authOverlay').style.display='none';
  document.getElementById('adminPasswordInput').value='';
  document.getElementById('tokenInput').value='';
  unlocked=true;resetTimer();loadData();
}
function lockApp(){
  document.getElementById('authOverlay').style.display='flex';
  unlocked=false;clearTimeout(lockT);
  setTimeout(()=>{const ti=document.getElementById('tokenInput');if(ti){const s=getToken();if(s){ti.value=s;ti.placeholder='(saved)'}}},60);
}
function resetTimer(){if(!unlocked)return;clearTimeout(lockT);lockT=setTimeout(lockApp,LOCK_MS)}
['mousemove','keydown','click','scroll','touchstart'].forEach(e=>document.addEventListener(e,resetTimer,{passive:true}));
document.addEventListener('visibilitychange',()=>{if(document.hidden)lockApp()});
lockApp();

/* ============ STATE ============ */
let banners=[],products=[];

/* ============ HELPERS ============ */
function toB64(s){return btoa(unescape(encodeURIComponent(s)))}
function fromB64(s){
  const b=atob(s.replace(/\n/g,''));
  try{return decodeURIComponent(escape(b))}catch(e){return b}
}
function fileToB64(f){
  return new Promise((res,rej)=>{const r=new FileReader();r.readAsDataURL(f);r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej})
}
function compressImage(file,maxDim,quality){
  maxDim=maxDim||1200;quality=quality||0.75;
  return new Promise((res,rej)=>{
    const reader=new FileReader();
    reader.onload=function(e){
      const img=new Image();
      img.onload=function(){
        let w=img.width,h=img.height;
        if(w>maxDim||h>maxDim){
          if(w>h){h=Math.round(h*maxDim/w);w=maxDim}
          else{w=Math.round(w*maxDim/h);h=maxDim}
        }
        const c=document.createElement('canvas');
        c.width=w;c.height=h;
        const ctx=c.getContext('2d');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        c.toBlob(b=>{
          if(!b)return rej(new Error('Compression failed'));
          const r2=new FileReader();
          r2.onload=function(){res(r2.result.split(',')[1])};
          r2.onerror=rej;
          r2.readAsDataURL(b);
        },'image/jpeg',quality);
      };
      img.onerror=()=>rej(new Error('Image load failed'));
      img.src=e.target.result;
    };
    reader.onerror=rej;
    reader.readAsDataURL(file);
  });
}

/* ============ FETCH WITH RETRY ============ */
async function fetchRetry(url,opt,tries){
  tries=tries||3;let lastErr;
  for(let i=0;i<tries;i++){
    try{
      const r=await fetch(url,opt);
      if(r.ok||r.status===404||r.status===403||r.status===409)return r;
      lastErr=new Error('HTTP '+r.status);
    }catch(e){lastErr=e}
    if(i<tries-1)await new Promise(r=>setTimeout(r,700*(i+1)));
  }
  throw lastErr||new Error('Network error');
}

/* ============ GITHUB API ============ */
async function getSha(path){
  const t=getToken();if(!t)return null;
  try{
    const r=await fetchRetry(API_BASE+'/'+path+'?ref='+GH_BRANCH+'&t='+Date.now(),{
      headers:{'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json'},cache:'no-store'
    });
    if(r.status===404)return null;
    if(!r.ok)return null;
    return (await r.json()).sha;
  }catch(e){return null}
}
async function getJSON(path){
  const t=getToken();
  const h={'Accept':'application/vnd.github+json'};if(t)h['Authorization']='Bearer '+t;
  const r=await fetchRetry(API_BASE+'/'+path+'?ref='+GH_BRANCH+'&t='+Date.now(),{headers:h,cache:'no-store'});
  if(r.status===404)return[];
  if(!r.ok)return null;
  const d=await r.json();
  try{return JSON.parse(fromB64(d.content))}catch(e){return[]}
}

/* ============ PUSH FILE (with auto-retry on 409 conflict) ============ */
async function pushFile(path,b64,msg){
  const t=getToken();if(!t)throw new Error('No GitHub token');
  let sha=await getSha(path);
  const body={message:msg,content:b64,branch:GH_BRANCH};if(sha)body.sha=sha;
  let r=await fetchRetry(API_BASE+'/'+path,{
    method:'PUT',
    headers:{'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  // Auto-retry once on 409 conflict (stale SHA)
  if(r.status===409){
    await new Promise(res=>setTimeout(res,600));
    sha=await getSha(path);
    const body2={message:msg,content:b64,branch:GH_BRANCH};if(sha)body2.sha=sha;
    r=await fetchRetry(API_BASE+'/'+path,{
      method:'PUT',
      headers:{'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
      body:JSON.stringify(body2)
    });
  }
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.message||('Error '+r.status))}
  return r.json();
}

/* ============ UPLOAD IMAGE (unique name + no conflicts) ============ */
async function uploadImage(file,idx){
  let b64;
  try{b64=await compressImage(file,1200,0.75)}catch(e){b64=await fileToB64(file)}
  const safe=(file.name||'img').replace(/[^a-zA-Z0-9._-]/g,'_').replace(/\.[^.]+$/,'')+'.jpg';
  const rand=Math.random().toString(36).substring(2,9);
  const name=Date.now()+'_'+(idx||0)+'_'+rand+'_'+safe;
  const path='images/'+name;
  await pushFile(path,b64,'Upload '+name);
  return RAW_BASE+'/'+path;
}

/* ============ LOAD DATA ============ */
async function loadData(){
  try{
    const[b,p]=await Promise.all([getJSON('banners.json'),getJSON('products.json')]);
    banners=Array.isArray(b)?b:[];
    products=Array.isArray(p)?p:[];
    renderBanners();renderProducts();
  }catch(e){toast('Load error: '+e.message)}
}

/* ============ RENDER ============ */
function getImgs(p){if(Array.isArray(p.images)&&p.images.length)return p.images;if(p.image)return[p.image];return[]}

function renderBanners(){
  document.getElementById('bannerCount').textContent=banners.length;
  const el=document.getElementById('bannerList');
  if(!banners.length){el.innerHTML='<div class="empty"><i class="fa-solid fa-image"></i><p>No banners yet</p></div>';return}
  el.innerHTML=banners.map((b,i)=>
    '<div class="item-row" data-index="'+i+'">'+
    '<div class="position-num">'+(i+1)+'</div>'+
    '<div class="drag-handle" data-handle="'+i+'"><i class="fa-solid fa-grip-vertical"></i></div>'+
    '<img class="item-thumb" src="'+(b.image||'')+'" onerror="this.src=\'https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?w=200&q=60\'">'+
    '<div class="item-info">'+
    '<div class="item-title">'+(b.label||b.title||'Banner #'+(i+1))+'</div>'+
    '<div class="item-sub">'+(b.desc||'No description')+'</div>'+
    '</div>'+
    '<div class="item-actions">'+
    '<button class="btn btn-icon" onclick="editBanner('+b.id+')"><i class="fa-solid fa-pen"></i></button>'+
    '<button class="btn btn-icon danger" onclick="deleteBanner('+b.id+')"><i class="fa-solid fa-trash"></i></button>'+
    '</div>'+
    '</div>'
  ).join('');
  attachDrag('bannerList',banners,'banners.json',renderBanners);
}

function renderProducts(){
  document.getElementById('productCount').textContent=products.length;
  const el=document.getElementById('productList');
  if(!products.length){el.innerHTML='<div class="empty"><i class="fa-solid fa-box-open"></i><p>No products yet</p></div>';return}
  el.innerHTML=products.map((p,i)=>{
    const imgs=getImgs(p);
    return '<div class="item-row">'+
    '<img class="item-thumb" src="'+(imgs[0]||'')+'" onerror="this.src=\'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=200&q=60\'">'+
    '<div class="item-info">'+
    '<div class="item-title">'+p.name+'</div>'+
    '<div class="item-sub">₦'+Number(p.price||0).toLocaleString()+'</div>'+
    '<div class="item-meta">'+
    '<span class="chip">'+p.category+'</span>'+
    (p.is_sold_out?'<span class="chip danger">Sold Out</span>':'<span class="chip success">Available</span>')+
    (imgs.length>1?'<span class="chip gold"><i class="fa-solid fa-images"></i> '+imgs.length+'</span>':'')+
    '</div>'+
    '</div>'+
    '<div class="item-actions">'+
    '<button class="btn btn-icon" onclick="editProduct('+p.id+')"><i class="fa-solid fa-pen"></i></button>'+
    '<button class="btn btn-icon danger" onclick="deleteProduct('+p.id+')"><i class="fa-solid fa-trash"></i></button>'+
    '</div>'+
    '</div>';
  }).join('');
}

/* ============ DRAG-TO-REORDER ============ */
function attachDrag(listId,arr,savePath,reRender){
  const list=document.getElementById(listId);
  list.querySelectorAll('.drag-handle').forEach(h=>{
    h.addEventListener('pointerdown',startDrag);
  });

  function startDrag(e){
    e.preventDefault();
    const idx=parseInt(e.currentTarget.dataset.handle,10);
    const rows=Array.from(list.querySelectorAll('.item-row'));
    const moved=rows[idx];
    if(!moved)return;
    const startY=e.clientY;
    const rowH=rows[0].getBoundingClientRect().height+10;
    let newIdx=idx;
    moved.classList.add('dragging');
    moved.style.zIndex=100;

    const onMove=ev=>{
      const dy=ev.clientY-startY;
      moved.style.transform='translateY('+dy+'px)';
      newIdx=Math.max(0,Math.min(rows.length-1,idx+Math.round(dy/rowH)));
      rows.forEach((r,i)=>{
        if(r===moved){r.style.transform='';return}
        let off=0;
        if(idx<newIdx&&i>idx&&i<=newIdx)off=-rowH;
        else if(idx>newIdx&&i<idx&&i>=newIdx)off=rowH;
        r.style.transform=off?'translateY('+off+'px)':'';
      });
    };
    const onUp=async()=>{
      document.removeEventListener('pointermove',onMove);
      document.removeEventListener('pointerup',onUp);
      document.removeEventListener('pointercancel',onUp);
      rows.forEach(r=>{r.style.transform='';r.classList.remove('dragging');r.style.zIndex=''});
      if(newIdx===idx)return;
      const[item]=arr.splice(idx,1);
      arr.splice(newIdx,0,item);
      reRender();
      try{
        const b64=toB64(JSON.stringify(arr,null,2));
        await pushFile(savePath,b64,'Reorder '+savePath);
        toast('Order saved!');
      }catch(err){toast('Save failed: '+err.message)}
    };
    document.addEventListener('pointermove',onMove,{passive:false});
    document.addEventListener('pointerup',onUp);
    document.addEventListener('pointercancel',onUp);
  }
}

/* ============ IMAGE PREVIEW ============ */
function previewImage(input,pid,urlId){
  const lbl=input.id==='bannerFile'?'bannerFileLabel':'productFileLabel';
  if(input.files&&input.files[0]){
    const f=input.files[0];
    document.getElementById(lbl).textContent=f.name.length>26?f.name.slice(0,24)+'…':f.name;
    const r=new FileReader();
    r.onload=e=>{
      const p=document.getElementById(pid);
      if(p){p.src=e.target.result;p.style.display='block'}
      document.getElementById(urlId).value='';
    };
    r.readAsDataURL(f);
  }
}

/* ============ BANNER CRUD ============ */
function openBannerModal(data){
  document.getElementById('bannerModal').classList.add('show');
  document.getElementById('bannerFile').value='';
  document.getElementById('bannerPreview').style.display='none';
  document.getElementById('bannerFileLabel').textContent='Tap to choose image';
  if(data){
    document.getElementById('bannerModalTitle').textContent='Edit Banner';
    document.getElementById('bannerEditId').value=data.id;
    document.getElementById('bannerLabel').value=data.label||'';
    document.getElementById('bannerTitle').value=data.title||'';
    document.getElementById('bannerDesc').value=data.desc||'';
    document.getElementById('bannerBtnText').value=data.btntext||'';
    document.getElementById('bannerBtnCategory').value=data.btncategory||'';
    document.getElementById('bannerImageUrl').value=data.image||'';
    document.getElementById('bannerImageAlt').value='';
    if(data.image){const p=document.getElementById('bannerPreview');p.src=data.image;p.style.display='block'}
  }else{
    document.getElementById('bannerModalTitle').textContent='Add Banner';
    document.getElementById('bannerForm').reset();
    document.getElementById('bannerEditId').value='';
    document.getElementById('bannerImageUrl').value='';
    document.getElementById('bannerImageAlt').value='';
  }
}
function closeModal(id){document.getElementById(id).classList.remove('show')}

async function saveBanner(e){
  e.preventDefault();
  showProgress('Saving banner','Uploading and updating');
  updateProgress(10,'Preparing...');
  try{
    let imageUrl=document.getElementById('bannerImageUrl').value;
    const f=document.getElementById('bannerFile');
    if(f.files&&f.files.length){
      updateProgress(30,'Compressing image...');
      imageUrl=await uploadImage(f.files[0],0);
    }
    if(!imageUrl)throw new Error('Please add an image');
    updateProgress(70,'Reading data...');
    const id=document.getElementById('bannerEditId').value;
    const rec={
      label:document.getElementById('bannerLabel').value||'',
      title:document.getElementById('bannerTitle').value||'',
      desc:document.getElementById('bannerDesc').value||'',
      btntext:document.getElementById('bannerBtnText').value||'',
      btncategory:document.getElementById('bannerBtnCategory').value||'',
      image:imageUrl
    };
    const fresh=await getJSON('banners.json');
    const base=Array.isArray(fresh)?fresh:banners;
    let updated;
    if(id){updated=base.map(b=>String(b.id)===String(id)?{...b,...rec}:b)}
    else{
      const nid=base.length?Math.max(...base.map(b=>Number(b.id)||0))+1:1;
      updated=base.concat([{id:nid,...rec}]);
    }
    updateProgress(85,'Saving to GitHub...');
    await pushFile('banners.json',toB64(JSON.stringify(updated,null,2)),id?'Update banner':'Add banner');
    updateProgress(100,'Done!');
    banners=updated;renderBanners();
    toast(id?'Banner updated':'Banner added');
    closeModal('bannerModal');
  }catch(err){toast('Error: '+err.message)}
  finally{setTimeout(hideProgress,400)}
}

function editBanner(id){const b=banners.find(x=>String(x.id)===String(id));if(b)openBannerModal(b)}

async function deleteBanner(id){
  if(!confirm('Delete this banner?'))return;
  showProgress('Deleting...','Updating GitHub');
  updateProgress(30,'Reading...');
  try{
    const fresh=await getJSON('banners.json');
    const base=Array.isArray(fresh)?fresh:banners;
    const updated=base.filter(b=>String(b.id)!==String(id));
    updateProgress(70,'Saving...');
    await pushFile('banners.json',toB64(JSON.stringify(updated,null,2)),'Delete banner');
    updateProgress(100,'Done!');
    banners=updated;renderBanners();toast('Banner deleted');
  }catch(e){toast('Error: '+e.message)}
  finally{setTimeout(hideProgress,400)}
}

/* ============ PRODUCT CRUD ============ */
let productImages=[];

function handleProductFiles(input){
  const f=input.files;if(!f||!f.length)return;
  document.getElementById('productFileLabel').textContent=f.length+' image'+(f.length>1?'s':'')+' selected';
  const grid=document.getElementById('productThumbs');
  grid.innerHTML='';productImages=[];
  for(let i=0;i<f.length;i++){
    (function(file,idx){
      const url=URL.createObjectURL(file);
      productImages.push({local:true,file:file,url:url});
      const t=document.createElement('div');
      t.className='thumb';
      t.innerHTML='<img src="'+url+'">'+(idx===0?'<span class="badge">Cover</span>':'');
      grid.appendChild(t);
    })(f[i],i);
  }
}
function renderProductThumbs(){
  const grid=document.getElementById('productThumbs');
  grid.innerHTML='';
  productImages.forEach((img,idx)=>{
    const url=typeof img==='string'?img:img.url;
    const t=document.createElement('div');
    t.className='thumb';
    t.innerHTML='<img src="'+url+'"><button type="button" class="rm" onclick="removeProductImage('+idx+')"><i class="fa-solid fa-xmark"></i></button>'+(idx===0?'<span class="badge">Cover</span>':'');
    grid.appendChild(t);
  });
}
function removeProductImage(i){productImages.splice(i,1);renderProductThumbs()}

function openProductModal(data){
  document.getElementById('productModal').classList.add('show');
  document.getElementById('productFiles').value='';
  document.getElementById('productFileLabel').textContent='Tap to choose images';
  document.getElementById('productThumbs').innerHTML='';
  productImages=[];
  if(data){
    document.getElementById('productModalTitle').textContent='Edit Product';
    document.getElementById('productEditId').value=data.id;
    document.getElementById('productName').value=data.name||'';
    document.getElementById('productPrice').value=data.price||'';
    document.getElementById('productDiscount').value=data.discount||'';
    document.getElementById('productCategory').value=data.category||'Electronics';
    document.getElementById('productDesc').value=data.desc||'';
    document.getElementById('productSoldOut').checked=data.is_sold_out===true;
    productImages=getImgs(data).slice();
    renderProductThumbs();
  }else{
    document.getElementById('productModalTitle').textContent='Add Product';
    document.getElementById('productForm').reset();
    document.getElementById('productEditId').value='';
    document.getElementById('productSoldOut').checked=false;
  }
}

async function saveProduct(e){
  e.preventDefault();
  showProgress('Saving product','Please wait');
  updateProgress(5,'Preparing...');
  try{
    const newUrls=[];
    const locals=productImages.filter(x=>typeof x!=='string');
    const keeps=productImages.filter(x=>typeof x==='string');

    // Upload one at a time to avoid GitHub SHA conflicts
    if(locals.length){
      updateProgress(15,'Uploading '+locals.length+' image(s)...');
      for(let i=0;i<locals.length;i++){
        updateProgress(15+Math.round((i/locals.length)*55),'Uploading image '+(i+1)+' of '+locals.length+'...');
        const url=await uploadImage(locals[i].file,i);
        newUrls.push(url);
      }
    }

    const all=keeps.concat(newUrls);
    if(!all.length)throw new Error('Add at least one image');
    updateProgress(75,'Reading data...');
    const id=document.getElementById('productEditId').value;
    const rec={
      name:document.getElementById('productName').value,
      price:parseInt(document.getElementById('productPrice').value)||0,
      discount:parseInt(document.getElementById('productDiscount').value)||0,
      category:document.getElementById('productCategory').value,
      desc:document.getElementById('productDesc').value,
      is_sold_out:document.getElementById('productSoldOut').checked,
      image:all[0],
      images:all
    };
    const fresh=await getJSON('products.json');
    const base=Array.isArray(fresh)?fresh:products;
    let updated;
    if(id){updated=base.map(p=>String(p.id)===String(id)?{...p,...rec}:p)}
    else{
      const nid=base.length?Math.max(...base.map(p=>Number(p.id)||0))+1:1;
      updated=base.concat([{id:nid,...rec}]);
    }
    updateProgress(90,'Saving...');
    await pushFile('products.json',toB64(JSON.stringify(updated,null,2)),id?'Update product':'Add product');
    updateProgress(100,'Done!');
    products=updated;renderProducts();
    toast(id?'Product updated':'Product added');
    closeModal('productModal');
  }catch(err){toast('Error: '+err.message)}
  finally{setTimeout(hideProgress,400)}
}

function editProduct(id){const p=products.find(x=>String(x.id)===String(id));if(p)openProductModal(p)}

async function deleteProduct(id){
  if(!confirm('Delete this product?'))return;
  showProgress('Deleting...','Updating GitHub');
  updateProgress(30,'Reading...');
  try{
    const fresh=await getJSON('products.json');
    const base=Array.isArray(fresh)?fresh:products;
    const updated=base.filter(p=>String(p.id)!==String(id));
    updateProgress(70,'Saving...');
    await pushFile('products.json',toB64(JSON.stringify(updated,null,2)),'Delete product');
    updateProgress(100,'Done!');
    products=updated;renderProducts();toast('Product deleted');
  }catch(e){toast('Error: '+e.message)}
  finally{setTimeout(hideProgress,400)}
}

/* ============ EXPORT / IMPORT ============ */
function exportData(){
  const d={banners,products,exportedAt:new Date().toISOString()};
  const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  const u=URL.createObjectURL(b);
  const a=document.createElement('a');
  a.href=u;a.download='pge_backup_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();URL.revokeObjectURL(u);toast('Backup downloaded');
}
function importData(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.json';
  inp.onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=async ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(!d.banners||!d.products)throw new Error('Invalid file');
        if(!confirm('Replace with '+d.products.length+' products and '+d.banners.length+' banners?'))return;
        showProgress('Importing...','Updating');
        updateProgress(30,'Uploading banners...');
        await pushFile('banners.json',toB64(JSON.stringify(d.banners,null,2)),'Import banners');
        updateProgress(70,'Uploading products...');
        await pushFile('products.json',toB64(JSON.stringify(d.products,null,2)),'Import products');
        updateProgress(100,'Done!');
        banners=d.banners;products=d.products;
        renderBanners();renderProducts();toast('Imported!');
      }catch(err){toast('Error: '+err.message)}
      finally{setTimeout(hideProgress,400)}
    };
    r.readAsText(f);
  };
  inp.click();
}

/* ============ PROGRESS ============ */
function showProgress(title,sub){
  document.getElementById('progressTitle').textContent=title||'Saving...';
  document.getElementById('progressSub').textContent=sub||'Please wait';
  document.getElementById('progressFill').style.width='0%';
  document.getElementById('progressStatus').textContent='Starting...';
  document.getElementById('progressOverlay').classList.add('show');
}
function updateProgress(p,s){
  document.getElementById('progressFill').style.width=p+'%';
  if(s)document.getElementById('progressStatus').textContent=s;
}
function hideProgress(){document.getElementById('progressOverlay').classList.remove('show')}

/* ============ TOAST ============ */
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),3000);
}

document.querySelectorAll('.modal').forEach(m=>{
  m.addEventListener('click',function(e){if(e.target===m)m.classList.remove('show')});
});
</script>
