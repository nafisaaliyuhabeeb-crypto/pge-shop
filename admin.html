<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PGE Shop - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --primary: #f5b400;
            --dark: #101828;
            --text: #172033;
            --muted: #667085;
            --bg: #f7f8fa;
            --card: #ffffff;
            --border: #eaecf0;
            --green: #16a34a;
            --red: #ef4444;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            padding-bottom: 80px;
        }
        .admin-header {
            background: var(--dark);
            color: #fff;
            padding: 16px 20px;
            border-radius: 16px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .admin-header h1 {
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .admin-header h1 i {
            color: var(--primary);
        }
        .admin-header a {
            color: var(--primary);
            font-weight: 700;
            font-size: 13px;
            text-decoration: none;
        }
        .admin-header a:hover {
            text-decoration: underline;
        }
        .admin-section {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }
        .admin-section h2 {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .admin-section h2 i {
            color: var(--primary);
        }
        .btn {
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 12px;
            border: none;
            cursor: pointer;
            transition: transform 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-primary {
            background: var(--primary);
            color: var(--dark);
        }
        .btn-success {
            background: var(--green);
            color: #fff;
        }
        .btn-danger {
            background: var(--red);
            color: #fff;
        }
        .btn-secondary {
            background: var(--border);
            color: var(--text);
        }
        .btn-sm {
            padding: 4px 10px;
            font-size: 10px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--muted);
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: inherit;
            font-size: 13px;
            background: #fff;
            transition: border-color 0.2s;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        table th {
            text-align: left;
            padding: 10px 8px;
            background: var(--bg);
            font-weight: 700;
            border-bottom: 2px solid var(--border);
        }
        table td {
            padding: 10px 8px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        table td img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 6px;
        }
        .actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 9px;
            font-weight: 700;
            background: var(--bg);
            color: var(--muted);
        }
        .badge-active {
            background: #dcfce7;
            color: #15803d;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(16, 24, 40, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal-card {
            background: #fff;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            position: relative;
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from {
                transform: scale(0.95);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        .modal-card h3 {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 16px;
        }
        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--bg);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
        }
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--dark);
            color: #fff;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 12px;
            z-index: 2000;
            display: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }
        .toast.show {
            display: block;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from {
                transform: translateX(-50%) translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }
        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: var(--muted);
        }
        .empty-state i {
            font-size: 32px;
            margin-bottom: 8px;
            color: #d0d5dd;
        }
        .tab-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: #fff;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
        }
        .tab-btn.active {
            background: var(--dark);
            color: #fff;
            border-color: var(--dark);
        }
        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .admin-header {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="admin-header">
        <h1><i class="fa-solid fa-crown"></i> PGE Shop Admin</h1>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <a href="#" onclick="exportData()"><i class="fa-solid fa-download"></i> Export</a>
            <a href="#" onclick="importData()"><i class="fa-solid fa-upload"></i> Import</a>
            <a href="index.html" target="_blank"><i class="fa-solid fa-eye"></i> View Store</a>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="toast"></div>

    <!-- BANNERS SECTION -->
    <div class="admin-section">
        <h2><i class="fa-solid fa-image"></i> Manage Banners</h2>
        <button class="btn btn-primary" onclick="openBannerModal()"><i class="fa-solid fa-plus"></i> Add Banner</button>
        <div style="margin-top:12px;">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Label</th>
                            <th>Title</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="bannerTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- PRODUCTS SECTION -->
    <div class="admin-section">
        <h2><i class="fa-solid fa-box"></i> Manage Products</h2>
        <button class="btn btn-primary" onclick="openProductModal()"><i class="fa-solid fa-plus"></i> Add Product</button>
        <div style="margin-top:12px;">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Discount</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- BANNER MODAL -->
    <div id="bannerModal" class="modal-overlay">
        <div class="modal-card">
            <button class="modal-close" onclick="closeModal('bannerModal')"><i class="fa-solid fa-xmark"></i></button>
            <h3 id="bannerModalTitle">Add Banner</h3>
            <form id="bannerForm" onsubmit="saveBanner(event)">
                <input type="hidden" id="bannerEditId">
                <div class="form-group">
                    <label>Label (e.g., Electronics Deal)</label>
                    <input type="text" id="bannerLabel" required placeholder="Electronics Deal">
                </div>
                <div class="form-group">
                    <label>Title (e.g., Upgrade Your Lifestyle)</label>
                    <input type="text" id="bannerTitle" required placeholder="Upgrade Your Lifestyle">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" id="bannerDesc" placeholder="Discover quality electronics...">
                </div>
                <div class="form-group">
                    <label>Button Text (e.g., Shop Electronics)</label>
                    <input type="text" id="bannerBtnText" placeholder="Shop Electronics">
                </div>
                <div class="form-group">
                    <label>Button Category (e.g., Electronics)</label>
                    <input type="text" id="bannerBtnCategory" placeholder="Electronics">
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="url" id="bannerImage" required placeholder="https://images.unsplash.com/...">
                </div>
                <button type="submit" class="btn btn-success" style="width:100%;justify-content:center;padding:12px;">
                    <i class="fa-solid fa-save"></i> Save Banner
                </button>
            </form>
        </div>
    </div>

    <!-- PRODUCT MODAL -->
    <div id="productModal" class="modal-overlay">
        <div class="modal-card">
            <button class="modal-close" onclick="closeModal('productModal')"><i class="fa-solid fa-xmark"></i></button>
            <h3 id="productModalTitle">Add Product</h3>
            <form id="productForm" onsubmit="saveProduct(event)">
                <input type="hidden" id="productEditId">
                <div class="form-group">
                    <label>Product Name *</label>
                    <input type="text" id="productName" required placeholder="Smart 4K Ultra HD TV 55&quot;">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Price (₦) *</label>
                        <input type="number" id="productPrice" required placeholder="320000">
                    </div>
                    <div class="form-group">
                        <label>Discount %</label>
                        <input type="number" id="productDiscount" placeholder="15" min="0" max="100">
                    </div>
                </div>
                <div class="form-group">
                    <label>Category *</label>
                    <select id="productCategory" required>
                        <option value="Electronics">Electronics</option>
                        <option value="Phones">Phones</option>
                        <option value="Laptop">Laptop</option>
                        <option value="Fashion">Fashion</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description *</label>
                    <textarea id="productDesc" required placeholder="Crystal clear 4K display..."></textarea>
                </div>
                <div class="form-group">
                    <label>Image URL *</label>
                    <input type="url" id="productImage" required placeholder="https://images.unsplash.com/...">
                </div>
                <button type="submit" class="btn btn-success" style="width:100%;justify-content:center;padding:12px;">
                    <i class="fa-solid fa-save"></i> Save Product
                </button>
            </form>
        </div>
    </div>

    <script>
        // =============================================
        // SUPABASE CONFIGURATION
        // =============================================
        const SUPABASE_URL = 'https://puswrhvjnxrgakyobres.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_IYOKqT4SfzVyyOBqkMPL2Q_jtPs92a0';

        // Initialize Supabase client
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // =============================================
        // DATA STORE (Supabase)
        // =============================================

        let banners = [];
        let products = [];

        // =============================================
        // LOAD DATA FROM SUPABASE
        // =============================================

        async function loadProducts() {
            try {
                const { data, error } = await supabase
                    .from('products')
                    .select('*')
                    .order('id', { ascending: true });
                
                if (error) throw error;
                products = data || [];
                renderProducts();
            } catch (error) {
                console.error('Error loading products:', error);
                showToast('Error loading products: ' + error.message);
            }
        }

        async function loadBanners() {
            try {
                const { data, error } = await supabase
                    .from('banners')
                    .select('*')
                    .order('id', { ascending: true });
                
                if (error) throw error;
                banners = data || [];
                renderBanners();
            } catch (error) {
                console.error('Error loading banners:', error);
                showToast('Error loading banners: ' + error.message);
            }
        }

        // =============================================
        // RENDER FUNCTIONS
        // =============================================

        function renderBanners() {
            const tbody = document.getElementById('bannerTableBody');
            if (!banners || banners.length === 0) {
                tbody.innerHTML =
                    `<tr><td colspan="4"><div class="empty-state"><i class="fa-solid fa-image"></i><p>No banners added yet</p></div></td></tr>`;
                return;
            }
            tbody.innerHTML = banners.map(b => `
                <tr>
                    <td><img src="${b.image || 'https://via.placeholder.com/40'}" alt="${b.label || 'Banner'}" onerror="this.src='https://via.placeholder.com/40'"></td>
                    <td><strong>${b.label || 'Untitled'}</strong></td>
                    <td>${b.title || ''}</td>
                    <td>
                        <div class="actions">
                            <button class="btn btn-primary btn-sm" onclick="editBanner(${b.id})"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn btn-danger btn-sm" onclick="deleteBanner(${b.id})"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function renderProducts() {
            const tbody = document.getElementById('productTableBody');
            if (!products || products.length === 0) {
                tbody.innerHTML =
                    `<tr><td colspan="6"><div class="empty-state"><i class="fa-solid fa-box-open"></i><p>No products added yet</p></div></td></tr>`;
                return;
            }
            tbody.innerHTML = products.map(p => `
                <tr>
                    <td><img src="${p.image || 'https://via.placeholder.com/40'}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/40'"></td>
                    <td><strong>${p.name}</strong></td>
                    <td><span class="badge">${p.category}</span></td>
                    <td>₦${Number(p.price).toLocaleString()}</td>
                    <td>${p.discount ? p.discount + '%' : '-'}</td>
                    <td>
                        <div class="actions">
                            <button class="btn btn-primary btn-sm" onclick="editProduct(${p.id})"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn btn-danger btn-sm" onclick="deleteProduct(${p.id})"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // =============================================
        // BANNER CRUD
        // =============================================

        function openBannerModal(data) {
            document.getElementById('bannerModal').classList.add('show');
            if (data) {
                document.getElementById('bannerModalTitle').textContent = 'Edit Banner';
                document.getElementById('bannerEditId').value = data.id;
                document.getElementById('bannerLabel').value = data.label || '';
                document.getElementById('bannerTitle').value = data.title || '';
                document.getElementById('bannerDesc').value = data.desc || '';
                document.getElementById('bannerBtnText').value = data.btnText || '';
                document.getElementById('bannerBtnCategory').value = data.btnCategory || '';
                document.getElementById('bannerImage').value = data.image || '';
            } else {
                document.getElementById('bannerModalTitle').textContent = 'Add Banner';
                document.getElementById('bannerEditId').value = '';
                document.getElementById('bannerForm').reset();
            }
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        async function saveBanner(e) {
            e.preventDefault();
            const id = document.getElementById('bannerEditId').value;
            const data = {
                label: document.getElementById('bannerLabel').value,
                title: document.getElementById('bannerTitle').value,
                desc: document.getElementById('bannerDesc').value,
                btnText: document.getElementById('bannerBtnText').value,
                btnCategory: document.getElementById('bannerBtnCategory').value,
                image: document.getElementById('bannerImage').value,
            };

            try {
                if (id) {
                    // Update existing banner
                    const { error } = await supabase
                        .from('banners')
                        .update(data)
                        .eq('id', parseInt(id));
                    
                    if (error) throw error;
                    showToast('Banner updated successfully!');
                } else {
                    // Add new banner
                    const { error } = await supabase
                        .from('banners')
                        .insert([data]);
                    
                    if (error) throw error;
                    showToast('Banner added successfully!');
                }
                
                closeModal('bannerModal');
                await loadBanners();
            } catch (error) {
                console.error('Error saving banner:', error);
                showToast('Error saving banner: ' + error.message);
            }
        }

        function editBanner(id) {
            const banner = banners.find(b => b.id === id);
            if (banner) openBannerModal(banner);
        }

        async function deleteBanner(id) {
            if (!confirm('Delete this banner?')) return;
            
            try {
                const { error } = await supabase
                    .from('banners')
                    .delete()
                    .eq('id', id);
                
                if (error) throw error;
                showToast('Banner deleted!');
                await loadBanners();
            } catch (error) {
                console.error('Error deleting banner:', error);
                showToast('Error deleting banner: ' + error.message);
            }
        }

        // =============================================
        // PRODUCT CRUD
        // =============================================

        function openProductModal(data) {
            document.getElementById('productModal').classList.add('show');
            if (data) {
                document.getElementById('productModalTitle').textContent = 'Edit Product';
                document.getElementById('productEditId').value = data.id;
                document.getElementById('productName').value = data.name || '';
                document.getElementById('productPrice').value = data.price || '';
                document.getElementById('productDiscount').value = data.discount || '';
                document.getElementById('productCategory').value = data.category || 'Electronics';
                document.getElementById('productDesc').value = data.desc || '';
                document.getElementById('productImage').value = data.image || '';
            } else {
                document.getElementById('productModalTitle').textContent = 'Add Product';
                document.getElementById('productEditId').value = '';
                document.getElementById('productForm').reset();
            }
        }

        async function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('productEditId').value;
            const data = {
                name: document.getElementById('productName').value,
                price: parseInt(document.getElementById('productPrice').value),
                discount: parseInt(document.getElementById('productDiscount').value) || 0,
                category: document.getElementById('productCategory').value,
                desc: document.getElementById('productDesc').value,
                image: document.getElementById('productImage').value,
            };

            try {
                if (id) {
                    // Update existing product
                    const { error } = await supabase
                        .from('products')
                        .update(data)
                        .eq('id', parseInt(id));
                    
                    if (error) throw error;
                    showToast('Product updated successfully!');
                } else {
                    // Add new product
                    const { error } = await supabase
                        .from('products')
                        .insert([data]);
                    
                    if (error) throw error;
                    showToast('Product added successfully!');
                }
                
                closeModal('productModal');
                await loadProducts();
            } catch (error) {
                console.error('Error saving product:', error);
                showToast('Error saving product: ' + error.message);
            }
        }

        function editProduct(id) {
            const product = products.find(p => p.id === id);
            if (product) openProductModal(product);
        }

        async function deleteProduct(id) {
            if (!confirm('Delete this product?')) return;
            
            try {
                const { error } = await supabase
                    .from('products')
                    .delete()
                    .eq('id', id);
                
                if (error) throw error;
                showToast('Product deleted!');
                await loadProducts();
            } catch (error) {
                console.error('Error deleting product:', error);
                showToast('Error deleting product: ' + error.message);
            }
        }

        // =============================================
        // EXPORT / IMPORT
        // =============================================

        async function exportData() {
            // Refresh data from Supabase first
            await loadProducts();
            await loadBanners();
            
            const data = {
                banners: banners,
                products: products,
                exportedAt: new Date().toISOString()
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `pge_shop_data_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Data exported!');
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async function(ev) {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (data.banners && data.products) {
                            if (confirm('This will overwrite all current data. Continue?')) {
                                // Import banners
                                for (const banner of data.banners) {
                                    delete banner.id;
                                    const { error } = await supabase
                                        .from('banners')
                                        .insert([banner]);
                                    if (error) throw error;
                                }
                                
                                // Import products
                                for (const product of data.products) {
                                    delete product.id;
                                    const { error } = await supabase
                                        .from('products')
                                        .insert([product]);
                                    if (error) throw error;
                                }
                                
                                await loadProducts();
                                await loadBanners();
                                showToast('Data imported successfully!');
                            }
                        } else {
                            showToast('Invalid data format!');
                        }
                    } catch (err) {
                        console.error('Import error:', err);
                        showToast('Error importing data: ' + err.message);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // =============================================
        // TOAST
        // =============================================

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // =============================================
        // INIT
        // =============================================

        // Load data from Supabase on page load
        document.addEventListener('DOMContentLoaded', async function() {
            await loadProducts();
            await loadBanners();
            console.log('✅ PGE Admin Panel initialized with Supabase!');
            console.log(`📦 ${products.length} products, 🖼️ ${banners.length} banners`);
        });

        // Close modals on backdrop click
        document.querySelectorAll('.modal-overlay').forEach(el => {
            el.addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('show');
            });
        });
    </script>

</body>
</html>
