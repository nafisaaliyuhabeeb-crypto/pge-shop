<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PGE Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#F4F6FA;color:#0F172A;min-height:100vh;line-height:1.5;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
button{border:0;cursor:pointer;background:none}
input,select,textarea{-webkit-appearance:none;appearance:none}
#authOverlay{position:fixed;inset:0;background:#0A0F1F;z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:#fff;padding:32px 24px;border-radius:24px;width:100%;max-width:380px;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.4)}
.auth-logo{width:64px;height:64px;margin:0 auto 16px;border-radius:20px;background:linear-gradient(135deg,#FFD644,#FFB800);display:flex;align-items:center;justify-content:center;color:#0A0F1F;font-size:26px}
.auth-card h2{font-size:19px;font-weight:800;margin-bottom:6px}
.auth-card p{font-size:12px;color:#64748B;margin-bottom:22px}
.auth-field{position:relative;margin-bottom:12px;text-align:left}
.auth-field i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94A3B8;font-size:13px;pointer-events:none}
.auth-field input{width:100%;padding:14px 14px 14px 40px;border:1.5px solid #E5E9F0;border-radius:14px;font-size:13.5px;background:#F8FAFC;color:#0F172A}
.auth-field input:focus{outline:none;border-color:#FFB800;background:#fff;box-shadow:0 0 0 4px rgba(255,184,0,.15)}
.auth-btn{width:100%;padding:14px;background:linear-gradient(135deg,#FFD644,#FFB800);color:#0A0F1F;border-radius:14px;font-weight:800;font-size:14px;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px}
.auth-error{background:rgba(239,68,68,.1);color:#EF4444;font-size:12px;padding:10px;border-radius:10px;margin-top:12px;font-weight:600;display:none;text-align:center}
.auth-error.show{display:block}
.admin-header{position:sticky;top:0;z-index:100;background:#0A0F1F;padding:14px 16px}
.admin-header-inner{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.admin-title{display:flex;align-items:center;gap:10px;color:#fff}
.admin-title-icon{width:38px;height:38px;background:linear-gradient(135deg,#FFD644,#FFB800);border-radius:12px;display:flex;align-items:center;justify-content:center;color:#0A0F1F;font-size:16px}
.admin-title h1{font-size:15px;font-weight:800;line-height:1.2}
.admin-title span{font-size:10px;color:rgba(255,255,255,.5);display:block;margin-top:2px}
.admin-tools{display:flex;gap:6px;flex-wrap:wrap}
.tool-btn{padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.08);color:#fff;font-weight:600;font-size:11px;display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.08)}
.tool-btn i{color:#FFD644;font-size:12px}
main{max-width:960px;margin:0 auto;padding:20px 16px 40px}
.section{background:#fff;border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:0 4px 12px rgba(15,23,42,.06);border:1px solid #EDF1F7}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.section-head h2{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.section-head h2 i{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,#FFF7E6,#FFEFC2);color:#F59E0B;display:flex;align-items:center;justify-content:center;font-size:12px}
.count-pill{background:#EEF2F7;color:#64748B;font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:20px}
.btn{padding:10px 16px;border-radius:12px;font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.btn-primary{background:linear-gradient(135deg,#FFD644,#FFB800);color:#0A0F1F;box-shadow:0 6px 16px rgba(255,184,0,.35)}
.btn-success{background:linear-gradient(135deg,#34D399,#10B981);color:#fff}
.btn-danger{background:rgba(239,68,68,.1);color:#EF4444}
.btn-icon{width:36px;height:36px;padding:0;justify-content:center;border-radius:11px;background:#F1F5F9;color:#64748B}
.btn-icon.danger{background:rgba(239,68,68,.08);color:#EF4444}
.item-list{display:flex;flex-direction:column;gap:10px}
.item-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:#FAFBFD;border:1.5px solid #EDF1F7;touch-action:pan-y;position:relative;user-select:none}
.item-row.dragging{box-shadow:0 12px 32px rgba(15,23,42,.1);border-color:#FFB800;background:#fff;z-index:100}
.drag-handle{width:36px;height:44px;display:flex;align-items:center;justify-content:center;cursor:grab;color:#94A3B8;font-size:14px;touch-action:none;flex-shrink:0}
.position-num{position:absolute;top:6px;right:6px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:linear-gradient(135deg,#FFD644,#FFB800);color:#0A0F1F;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center}
.item-thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;background:#EEF2F7;flex-shrink:0}
.item-info{flex:1;min-width:0}
.item-title{font-size:13px;font-weight:700;color:#0A0F1F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.item-sub{font-size:11px;color:#64748B;margin-bottom:4px}
.item-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{font-size:9.5px;font-weight:700;padding:2px 8px;border-radius:8px;background:#EEF2F7;color:#64748B}
.chip.gold{background:linear-gradient(135deg,#FFF7E6,#FFEFC2);color:#F59E0B}
.chip.success{background:rgba(16,185,129,.12);color:#10B981}
.chip.danger{background:rgba(239,68,68,.1);color:#EF4444}
.item-actions{display:flex;gap:6px;flex-shrink:0}
.empty{padding:32px 16px;text-align:center;color:#64748B;background:#FAFBFD;border-radius:16px;border:1.5px dashed #E5E9F0}
.empty i{font-size:34px;color:#CBD5E1;margin-bottom:8px;display:block}
.modal{position:fixed;inset:0;background:rgba(10,15,31,.55);z-index:1000;display:none;align-items:flex-end;justify-content:center}
@media(min-width:640px){.modal{align-items:center;padding:20px}}
.modal.show{display:flex}
.modal-card{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;padding:22px 20px 26px;border-radius:24px 24px 0 0;position:relative;-webkit-overflow-scrolling:touch}
@media(min-width:640px){.modal-card{border-radius:24px}}
.modal-grabber{width:40px;height:4px;background:#E5E9F0;border-radius:2px;margin:0 auto 14px}
@media(min-width:640px){.modal-grabber{display:none}}
.modal-card h3{font-size:17px;font-weight:800;margin-bottom:16px}
.modal-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:#F1F5F9;color:#64748B;display:flex;align-items:center;justify-content:center;font-size:14px;z-index:10}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:11.5px;font-weight:700;color:#64748B;margin-bottom:6px;text-transform:uppercase}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 14px;border:1.5px solid #E5E9F0;border-radius:12px;font-size:13.5px;background:#FAFBFD;color:#0F172A}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:#FFB800;background:#fff;box-shadow:0 0 0 4px rgba(255,184,0,.13)}
.form-group textarea{resize:vertical;min-height:70px;font-family:inherit}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.form-row{grid-template-columns:1fr}}
.file-input-wrap{position:relative}
.file-input-wrap input[type="file"]{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:2}
.file-input-btn{display:flex;align-items:center;gap:10px;padding:14px;border:1.5px dashed #E5E9F0;border-radius:12px;background:#FAFBFD;color:#64748B;font-size:12.5px;font-weight:600}
.file-input-btn i{color:#F59E0B;font-size:15px}
.checkbox-group{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#FAFBFD;border:1.5px solid #E5E9F0;border-radius:12px;cursor:pointer}
.checkbox-group input{width:20px;height:20px;accent-color:#EF4444;cursor:pointer}
.checkbox-group label{margin:0;text-transform:none;font-size:13px;font-weight:600;cursor:pointer}
.submit-btn{width:100%;padding:14px;justify-content:center;margin-top:6px;font-size:14px}
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;margin-top:10px;touch-action:pan-y}
.img-cell{position:relative;aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:#EEF2F7;border:2px solid #EDF1F7;cursor:grab;touch-action:none;user-select:none}
.img-cell.cover{border-color:#FFB800;box-shadow:0 0 0 4px rgba(255,184,0,.18)}
.img-cell.dragging-img{opacity:.9;transform:scale(1.08);z-index:50;box-shadow:0 12px 32px rgba(15,23,42,.15)}
.img-cell img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.img-cell .rm{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:50%;background:rgba(239,68,68,.95);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;z-index:3}
.img-cell .badge{position:absolute;bottom:5px;left:5px;background:linear-gradient(135deg,#FFD644,#FFB800);color:#0A0F1F;font-size:8px;font-weight:800;padding:2px 7px;border-radius:6px;z-index:3}
.img-cell .num{position:absolute;top:5px;left:5px;width:20px;height:20px;background:rgba(10,15,31,.75);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;z-index:3}
.variant-row{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff;border:1.5px solid #E5E9F0;border-radius:12px 12px 0 0;border-bottom:0}
.variant-row input[type="text"]{flex:1;padding:8px 10px;border:1.5px solid #E5E9F0;border-radius:10px;font-size:13px;background:#fff}
.variant-toggle{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;color:#64748B;flex-shrink:0}
.toggle{position:relative;width:38px;height:22px;background:#CBD5E1;border-radius:11px;cursor:pointer;transition:background .2s;flex-shrink:0}
.toggle.on{background:#10B981}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .25s;box-shadow:0 2px 4px rgba(0,0,0,.15)}
.toggle.on::after{transform:translateX(16px)}
.variant-rm{width:30px;height:30px;border-radius:9px;background:rgba(239,68,68,.08);color:#EF4444;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.add-variant-btn{width:100%;padding:10px;border:1.5px dashed #E5E9F0;border-radius:12px;background:#FAFBFD;color:#F59E0B;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px}
.variant-empty{font-size:11.5px;color:#64748B;padding:8px;text-align:center;background:#FAFBFD;border-radius:10px;border:1.5px dashed #E5E9F0}
.brand-block{border:1.5px solid #E5E9F0;border-radius:12px;margin-bottom:10px;background:#FAFBFD;overflow:hidden}
.brand-block .variant-row{padding:10px 12px;background:#fff;border:0;border-radius:0}
.brand-colors-row{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-top:1px dashed #E5E9F0;background:#F8FAFC}
.brand-colors-label{width:100%;font-size:10.5px;font-weight:800;color:#94A3B8;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.brand-color-chip{padding:6px 12px;border-radius:9px;background:#fff;border:1.5px solid #E5E9F0;font-size:11.5px;font-weight:700;color:#64748B;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.brand-color-chip.on{background:linear-gradient(135deg,#FFD644,#FFB800);color:#0A0F1F;border-color:#FFB800}
.brand-color-chip.on i{color:#0A0F1F;font-size:10px}
.color-row{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#FAFBFD;border:1.5px solid #E5E9F0;border-radius:12px;margin-bottom:8px}
.color-row input[type="text"]{flex:1;padding:8px 10px;border:1.5px solid #E5E9F0;border-radius:10px;font-size:13px;background:#fff}
.progress-overlay{position:fixed;inset:0;background:rgba(10,15,31,.75);z-index:3000;display:none;align-items:center;justify-content:center;padding:20px}
.progress-overlay.show{display:flex}
.progress-card{background:#fff;padding:28px 22px;border-radius:22px;max-width:340px;width:100%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.progress-card .icon{width:56px;height:56px;margin:0 auto 14px;border-radius:18px;background:linear-gradient(135deg,#FFF7E6,#FFEFC2);color:#F59E0B;display:flex;align-items:center;justify-content:center;font-size:22px}
.progress-card h4{font-size:15px;font-weight:800;margin-bottom:6px}
.progress-card p{font-size:12px;color:#64748B;margin-bottom:16px}
.progress-bar{height:6px;background:#EEF2F7;border-radius:3px;overflow:hidden;margin-bottom:10px}
.progress-bar>div{height:100%;background:linear-gradient(90deg,#FFD644,#FFB800);width:0%;transition:width .3s;border-radius:3px}
.progress-status{font-size:11px;color:#64748B;font-weight:600}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(10,15,31,.96);color:#fff;padding:12px 20px;border-radius:14px;font-weight:600;font-size:12.5px;z-index:9999;opacity:0;pointer-events:none;box-shadow:0 12px 32px rgba(0,0,0,.35);transition:all .3s;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.notif-preview{background:#FFFBF0;border:1.5px solid #FDE68A;border-radius:14px;padding:14px;margin-bottom:12px;display:flex;gap:11px;align-items:flex-start}
.notif-preview i{color:#F59E0B;font-size:16px;margin-top:2px}
.notif-preview .txt{flex:1;font-size:12.5px;color:#78350F;line-height:1.5;font-weight:500}
.notif-empty{background:#FAFBFD;border:1.5px dashed #E5E9F0;border-radius:14px;padding:20px;text-align:center;color:#64748B;font-size:12px}
</style>
</head>
<body>

<div id="authOverlay">
<div class="auth-card">
<div class="auth-logo"><i class="fa-solid fa-crown"></i></div>
<h2>PGE Admin</h2>
<p>Sign in to manage your store</p>
<div class="auth-field"><i class="fa-solid fa-lock"></i><input type="password" id="adminPasswordInput" placeholder="Password"></div>
<div class="auth-field"><i class="fa-solid fa-key"></i><input type="password" id="tokenInput" placeholder="GitHub token"></div>
<button class="auth-btn" onclick="verifyAdmin()"><i class="fa-solid fa-unlock"></i> Unlock Dashboard</button>
<div id="authErrorMsg" class="auth-error"></div>
</div>
</div>

<header class="admin-header">
<div class="admin-header-inner">
<div class="admin-title">
<div class="admin-title-icon"><i class="fa-solid fa-crown"></i></div>
<div><h1>PGE Admin</h1><span>Content Manager</span></div>
</div>
<div class="admin-tools">
<button class="tool-btn" onclick="exportData()"><i class="fa-solid fa-download"></i> Export</button>
<button class="tool-btn" onclick="importData()"><i class="fa-solid fa-upload"></i> Import</button>
<button class="tool-btn" onclick="changeToken()"><i class="fa-solid fa-key"></i> Token</button>
<a class="tool-btn" href="index.html" target="_blank"><i class="fa-solid fa-eye"></i> View</a>
</div>
</div>
</header>

<main>
<section class="section">
<div class="section-head">
<h2><i class="fa-solid fa-bullhorn"></i> Push Notification <span class="count-pill" id="notifStatus">No active</span></h2>
</div>
<div id="notifCurrent"></div>
<div class="form-group">
<label>Message to customers</label>
<textarea id="notifMessage" placeholder="e.g. 20% off all phones today!" style="min-height:80px"></textarea>
</div>
<div class="form-row">
<button class="btn btn-success" onclick="saveNotification()"><i class="fa-solid fa-paper-plane"></i> Send</button>
<button class="btn btn-danger" onclick="clearNotification()"><i class="fa-solid fa-xmark"></i> Clear</button>
</div>
</section>

<section class="section">
<div class="section-head">
<h2><i class="fa-solid fa-image"></i> Banners <span class="count-pill" id="bannerCount">0</span></h2>
<button class="btn btn-primary" onclick="openBannerModal()"><i class="fa-solid fa-plus"></i> Add Banner</button>
</div>
<p style="font-size:11px;color:#64748B;margin-bottom:12px;"><i class="fa-solid fa-hand-pointer" style="color:#F59E0B"></i> Hold the grip icon to reorder — #1 plays first</p>
<div id="bannerList" class="item-list"></div>
</section>

<section class="section">
<div class="section-head">
<h2><i class="fa-solid fa-box"></i> Products <span class="count-pill" id="productCount">0</span></h2>
<button class="btn btn-primary" onclick="openProductModal()"><i class="fa-solid fa-plus"></i> Add Product</button>
</div>
<div id="productList" class="item-list"></div>
</section>
</main>

<div id="bannerModal" class="modal">
<div class="modal-card">
<div class="modal-grabber"></div>
<button class="modal-close" onclick="closeModal('bannerModal')"><i class="fa-solid fa-xmark"></i></button>
<h3 id="bannerModalTitle">Add Banner</h3>
<form id="bannerForm" onsubmit="saveBanner(event)">
<input type="hidden" id="bannerEditId">
<input type="hidden" id="bannerImageUrl">
<div class="form-group">
<label>Banner Image</label>
<div class="file-input-wrap">
<input type="file" id="bannerFile" accept="image/*" onchange="previewBanner(this)">
<div class="file-input-btn"><i class="fa-solid fa-cloud-arrow-up"></i> <span id="bannerFileLabel">Tap to choose</span></div>
</div>
<img id="bannerPreview" style="max-width:100%;max-height:120px;object-fit:cover;border-radius:12px;margin-top:10px;display:none" alt="">
</div>
<div class="form-group"><label>Or image URL</label><input type="url" id="bannerImageAlt" placeholder="https://..." oninput="document.getElementById('bannerImageUrl').value=this.value;var p=document.getElementById('bannerPreview');p.src=this.value;p.style.display=this.value?'block':'none'"></div>
<div class="form-group"><label>Label</label><input type="text" id="bannerLabel" placeholder="e.g. Flash Sale"></div>
<div class="form-group"><label>Title</label><input type="text" id="bannerTitle" placeholder="e.g. Upgrade Your Lifestyle"></div>
<div class="form-group"><label>Description</label><input type="text" id="bannerDesc" placeholder="Short subtitle"></div>
<div class="form-row">
<div class="form-group"><label>Button Text</label><input type="text" id="bannerBtnText" placeholder="Shop Now"></div>
<div class="form-group"><label>Button Category</label><input type="text" id="bannerBtnCategory" placeholder="Electronics"></div>
</div>
<button type="submit" class="btn btn-success submit-btn"><i class="fa-solid fa-check"></i> Save Banner</button>
</form>
</div>
</div>

<div id="productModal" class="modal">
<div class="modal-card">
<div class="modal-grabber"></div>
<button class="modal-close" onclick="closeModal('productModal')"><i class="fa-solid fa-xmark"></i></button>
<h3 id="productModalTitle">Add Product</h3>
<form id="productForm" onsubmit="saveProduct(event)">
<input type="hidden" id="productEditId">
<div class="form-group"><label>Product Name</label><input type="text" id="productName" required placeholder="e.g. iPhone"></div>
<div class="form-row">
<div class="form-group"><label>Price (N)</label><input type="number" id="productPrice" required placeholder="0"></div>
<div class="form-group"><label>Discount %</label><input type="number" id="productDiscount" placeholder="0" min="0" max="100"></div>
</div>
<div class="form-group"><label>Category</label>
<select id="productCategory" required>
<option value="Electronics">Electronics</option>
<option value="Phones">Phones</option>
<option value="Laptop">Laptop</option>
<option value="Fashion">Fashion</option>
</select>
</div>
<div class="form-group"><label>Description</label><textarea id="productDesc" required placeholder="Product details..."></textarea></div>

<div class="form-group">
<label>Step 1 — Add Colors</label>
<div id="colorsList"></div>
<button type="button" class="add-variant-btn" onclick="addColor()"><i class="fa-solid fa-plus"></i> Add Color</button>
</div>

<div class="form-group">
<label>Step 2 — Add Brands & pick which colors apply</label>
<div id="brandsList"></div>
<button type="button" class="add-variant-btn" onclick="addBrand()"><i class="fa-solid fa-plus"></i> Add Brand / Size</button>
</div>

<div class="form-group">
<div class="checkbox-group">
<input type="checkbox" id="productSoldOut">
<label for="productSoldOut">Mark entire product as Sold Out</label>
</div>
</div>

<div class="form-group">
<label>Images (drag to reorder — #1 is Cover)</label>
<div class="file-input-wrap">
<input type="file" id="productFiles" accept="image/*" multiple onchange="handleProductFiles(this)">
<div class="file-input-btn"><i class="fa-solid fa-images"></i> <span id="productFileLabel">Tap to add images</span></div>
</div>

function toB64(s){return btoa(unescape(encodeURIComponent(s)))}
function fromB64(s){var b=atob(s.replace(/\n/g,''));try{return decodeURIComponent(escape(b))}catch(e){return b}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fileToB64(f){return new Promise(function(res,rej){var r=new FileReader();r.readAsDataURL(f);r.onload=function(){res(r.result.split(',')[1])};r.onerror=rej})}

/* ===== IMPROVED COMPRESSION — works for ANY image, progressive fallback ===== */
function compressImage(file,maxDim,quality){
  maxDim=maxDim||900;quality=quality||0.72;
  return new Promise(function(res,rej){
    var reader=new FileReader();
    reader.onload=function(e){
      var img=new Image();
      img.onload=function(){
        var w=img.width,h=img.height;
        if(w>maxDim||h>maxDim){if(w>h){h=Math.round(h*maxDim/w);w=maxDim}else{w=Math.round(w*maxDim/h);h=maxDim}}
        var c=document.createElement('canvas');c.width=w;c.height=h;
        var ctx=c.getContext('2d');
        ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        c.toBlob(function(b){
          if(!b)return rej(new Error('Compression failed'));
          var r2=new FileReader();
          r2.onload=function(){res(r2.result.split(',')[1])};
          r2.onerror=rej;
          r2.readAsDataURL(b);
        },'image/jpeg',quality);
      };
      img.onerror=function(){rej(new Error('Image load failed'))};
      img.src=e.target.result;
    };
    reader.onerror=rej;reader.readAsDataURL(file);
  });
}

function fetchRetry(url,opt,tries){
  tries=tries||3;var lastErr;var chain=Promise.resolve();
  for(var i=0;i<tries;i++){(function(idx){
    chain=chain.then(function(){
      return fetch(url,opt).then(function(r){if(r.ok||r.status===404||r.status===403||r.status===409||r.status===422)return r;throw new Error('HTTP '+r.status)})
      .catch(function(e){lastErr=e;if(idx<tries-1)return new Promise(function(res){setTimeout(res,700*(idx+1))});throw lastErr});
    });
  })(i)}
  return chain;
}
function getSha(path){
  var t=getToken();if(!t)return Promise.resolve(null);
  return fetchRetry(API_BASE+'/'+path+'?ref='+GH_BRANCH+'&t='+Date.now(),{headers:{'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json'},cache:'no-store'})
  .then(function(r){if(r.status===404)return null;if(!r.ok)return null;return r.json().then(function(d){return d.sha})}).catch(function(){return null});
}
function getJSON(path){
  var t=getToken();var h={'Accept':'application/vnd.github+json'};if(t)h['Authorization']='Bearer '+t;
  return fetchRetry(API_BASE+'/'+path+'?ref='+GH_BRANCH+'&t='+Date.now(),{headers:h,cache:'no-store'})
  .then(function(r){if(r.status===404)return[];if(!r.ok)return null;return r.json().then(function(d){try{return JSON.parse(fromB64(d.content))}catch(e){return[]}})});
}
function pushFile(path,b64,msg){
  var t=getToken();if(!t)return Promise.reject(new Error('No GitHub token'));
  return getSha(path).then(function(sha){
    var body={message:msg,content:b64,branch:GH_BRANCH};if(sha)body.sha=sha;
    return fetchRetry(API_BASE+'/'+path,{method:'PUT',headers:{'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){
      if(r.status===409){return new Promise(function(res){setTimeout(res,600)}).then(function(){return getSha(path).then(function(newSha){var body2={message:msg,content:b64,branch:GH_BRANCH};if(newSha)body2.sha=newSha;return fetchRetry(API_BASE+'/'+path,{method:'PUT',headers:{'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body2)})})})}
      return r;
    }).then(function(r){
      if(r.status===422){throw new Error('Image too large for GitHub. Try a smaller image.')}
      if(!r.ok)return r.json().catch(function(){return{}}).then(function(e){throw new Error(e.message||('Error '+r.status))});
      return r.json();
    });
  });
}

/* ===== UPLOAD ANY IMAGE — 14-stage progressive fallback =====
   Tries (1200px @ q0.82) → (200px @ q0.3) until file fits under GitHub's
   1MB contents API limit (~700KB target for safety). Works for photos,
   screenshots, PNGs — anything. */
async function uploadImage(file,idx){
  var stages=[
    {dim:1200,q:0.82},
    {dim:1100,q:0.78},
    {dim:1000,q:0.74},
    {dim:950, q:0.70},
    {dim:900, q:0.66},
    {dim:850, q:0.62},
    {dim:800, q:0.58},
    {dim:700, q:0.54},
    {dim:600, q:0.50},
    {dim:500, q:0.46},
    {dim:400, q:0.42},
    {dim:320, q:0.38},
    {dim:260, q:0.34},
    {dim:200, q:0.30}
  ];
  var lastErr;
  for(var a=0;a<stages.length;a++){
    try{
      var b64=await compressImage(file,stages[a].dim,stages[a].q);
      var bytes=Math.round(b64.length*0.75);
      // GitHub Contents API: 1MB file limit. Target 700KB to be safe.
      if(bytes>700*1024)continue;
      var safe=(file.name||'img').replace(/[^a-zA-Z0-9._-]/g,'_').replace(/\.[^.]+$/,'')+'.jpg';
      if(safe.length>40)safe=safe.slice(-40);
      var rand=Math.random().toString(36).substring(2,9);
      var name=Date.now()+'_'+(idx||0)+'_'+rand+'_'+safe;
      var path='images/'+name;
      await pushFile(path,b64,'Upload '+name);
      return CDN_BASE+'/'+path;
    }catch(e){
      lastErr=e;
      var msg=(e&&e.message)?e.message.toLowerCase():'';
      // GitHub rejected due to size → try next (smaller) stage
      if(msg.indexOf('too large')!==-1||msg.indexOf('422')!==-1||msg.indexOf('413')!==-1){continue;}
      // Network/other error — brief pause and try next stage as fallback
      if(a<stages.length-1){await new Promise(function(r){setTimeout(r,400)});continue;}
      throw e;
    }
  }
  throw lastErr||new Error('Could not compress image small enough for GitHub. Try a smaller image.');
}

async function loadData(){

    const[b,p]=await Promise.all([getJSON('banners.json'),getJSON('products.json')]);
    banners=Array.isArray(b)?b:[];products=Array.isArray(p)?p:[];

}

      currentNotification=n;
      document.getElementById('notifMessage').value=n.message;

      document.getElementById('notifCurrent').innerHTML='<div class="notif-preview"><i class="fa-solid fa-bullhorn"></i><div class="txt">'+escapeHtml(n.message)+'</div></div>';

      currentNotification=null;
      document.getElementById('notifStatus').textContent='No active';
      document.getElementById('notifStatus').style.background='';
      document.getElementById('notifStatus').style.color='';
      document.getElementById('notifCurrent').innerHTML='<div class="notif-empty"><i class="fa-solid fa-bell-slash" style="font-size:20px;display:block;margin-bottom:6px;color:#CBD5E1;"></i>No active notification</div>';
    }
  }catch(e){}
}
async function saveNotification(){
  var msg=document.getElementById('notifMessage').value.trim();
  if(!msg){toast('Write a message first');return}
  showProgress('Sending notification','Updating GitHub');updateProgress(30,'Saving...');
  try{
    const data={message:msg,postedAt:Date.now(),id:'notif_'+Date.now()};
    await pushFile('notification.json',toB64(JSON.stringify(data,null,2)),'Update notification');
    updateProgress(100,'Done!');
    currentNotification=data;
    await loadNotification();
    toast('Notification sent!');
  }catch(e){toast('Error: '+e.message)}
  finally{setTimeout(hideProgress,400)}
}
async function clearNotification(){
  if(!confirm('Remove the current notification?'))return;
  showProgress('Clearing...','Updating GitHub');
  try{
    await pushFile('notification.json',toB64(JSON.stringify({message:'',postedAt:0,id:'cleared_'+Date.now()},null,2)),'Clear notification');
    updateProgress(100,'Done!');
    document.getElementById('notifMessage').value='';
    currentNotification=null;
    await loadNotification();
    toast('Notification cleared');
  }catch(e){toast('Error: '+e.message)}
  finally{setTimeout(hideProgress,400)}
}

  }
  el.innerHTML=html;
}

function attachListDrag(listId,arr,savePath,reRender){
  var list=document.getElementById(listId);
  var handles=list.querySelectorAll('.drag-handle');
  for(var i=0;i<handles.length;i++)handles[i].addEventListener('pointerdown',startDrag);
  function startDrag(e){
    e.preventDefault();
    var idx=parseInt(e.currentTarget.dataset.handle,10);
    var rows=Array.prototype.slice.call(list.querySelectorAll('.item-row'));
    var moved=rows[idx];if(!moved)return;
    var startY=e.clientY,rowH=rows[0].getBoundingClientRect().height+10;var newIdx=idx;
    moved.classList.add('dragging');
    function onMove(ev){
      var dy=ev.clientY-startY;moved.style.transform='translateY('+dy+'px)';
      newIdx=Math.max(0,Math.min(rows.length-1,idx+Math.round(dy/rowH)));
      for(var j=0;j<rows.length;j++){var r=rows[j];if(r===moved){r.style.transform='';continue}var off=0;if(idx<newIdx && j>idx && j<=newIdx)off=-rowH;else if(idx>newIdx && j<idx && j>=newIdx)off=rowH;r.style.transform=off?'translateY('+off+'px)':''}
    }
    function onUp(){
      document.removeEventListener('pointermove',onMove);document.removeEventListener('pointerup',onUp);document.removeEventListener('pointercancel',onUp);
      for(var j=0;j<rows.length;j++){rows[j].style.transform='';rows[j].classList.remove('dragging')}
      if(newIdx===idx)return;
      var item=arr.splice(idx,1)[0];arr.splice(newIdx,0,item);reRender();
      pushFile(savePath,toB64(JSON.stringify(arr,null,2)),'Reorder').then(function(){toast('Order saved!')}).catch(function(err){toast('Save failed: '+err.message)});
    }
    document.addEventListener('pointermove',onMove,{passive:false});document.addEventListener('pointerup',onUp);document.addEventListener('pointercancel',onUp);
  }
}

function previewBanner(input){
  if(input.files && input.files[0]){
    var f=input.files[0];
    document.getElementById('bannerFileLabel').textContent=f.name.length>26?f.name.slice(0,24)+'...':f.name;
    var r=new FileReader();
    r.onload=function(e){var p=document.getElementById('bannerPreview');p.src=e.target.result;p.style.display='block';document.getElementById('bannerImageUrl').value=''};
    r.readAsDataURL(f);
  }
}

function addColor(){colors.push({id:'c'+Date.now()+Math.random().toString(36).slice(2,5),name:'',available:true});renderColors();renderBrands()}
function removeColor(id){colors=colors.filter(function(c){return c.id!==id});for(var i=0;i<brands.length;i++){if(Array.isArray(brands[i].colors)){brands[i].colors=brands[i].colors.filter(function(cid){return cid!==id})}}renderColors();renderBrands()}
function toggleColor(id){for(var i=0;i<colors.length;i++){if(colors[i].id===id){colors[i].available=!colors[i].available;break}}renderColors();renderBrands()}
function setColorName(id,v){for(var i=0;i<colors.length;i++){if(colors[i].id===id){colors[i].name=v;break}}}
function renderColors(){
  var el=document.getElementById('colorsList');
  if(!colors.length){el.innerHTML='<div class="variant-empty">No colors yet — tap Add Color below</div>';return}
  var html='';
  for(var i=0;i<colors.length;i++){
    var c=colors[i];
    html+='<div class="color-row"><input type="text" value="'+escapeHtml(c.name)+'" placeholder="e.g. Midnight Black" oninput="setColorName(\''+c.id+'\',this.value)"><div class="variant-toggle"><div class="toggle '+(c.available?'on':'')+'" onclick="toggleColor(\''+c.id+'\')"></div><span>'+(c.available?'On':'Off')+'</span></div><button type="button" class="variant-rm" onclick="removeColor(\''+c.id+'\')"><i class="fa-solid fa-trash"></i></button></div>';
  }
  el.innerHTML=html;
}

function addBrand(){brands.push({id:'b'+Date.now()+Math.random().toString(36).slice(2,5),name:'',available:true,colors:[]});renderBrands()}
function removeBrand(id){brands=brands.filter(function(b){return b.id!==id});renderBrands()}
function toggleBrand(id){for(var i=0;i<brands.length;i++){if(brands[i].id===id){brands[i].available=!brands[i].available;break}}renderBrands()}
function setBrandName(id,v){for(var i=0;i<brands.length;i++){if(brands[i].id===id){brands[i].name=v;break}}}
function toggleBrandColor(brandId,colorId){
  for(var i=0;i<brands.length;i++){
    if(brands[i].id===brandId){
      if(!Array.isArray(brands[i].colors))brands[i].colors=[];
      var idx=brands[i].colors.indexOf(colorId);
      if(idx===-1)brands[i].colors.push(colorId);
      else brands[i].colors.splice(idx,1);
      break;
    }
  }
  renderBrands();
}
function renderBrands(){
  var el=document.getElementById('brandsList');
  if(!brands.length){el.innerHTML='<div class="variant-empty">No brands yet — tap Add Brand below</div>';return}
  var html='';
  for(var i=0;i<brands.length;i++){
    var b=brands[i];var bColors=Array.isArray(b.colors)?b.colors:[];
    var chips='';
    if(!colors.length){chips='<span style="font-size:11px;color:#94A3B8;">Add colors in Step 1 first</span>'}
    else{
      for(var j=0;j<colors.length;j++){
        var c=colors[j];var on=bColors.indexOf(c.id)!==-1;
        chips+='<button type="button" class="brand-color-chip '+(on?'on':'')+'" onclick="toggleBrandColor(\''+b.id+'\',\''+c.id+'\')">'+(on?'<i class="fa-solid fa-check"></i>':'')+escapeHtml(c.name||'Untitled')+'</button>';
      }
    }
    html+='<div class="brand-block"><div class="variant-row"><input type="text" value="'+escapeHtml(b.name)+'" placeholder="e.g. iPhone 18 Pro" oninput="setBrandName(\''+b.id+'\',this.value)"><div class="variant-toggle"><div class="toggle '+(b.available?'on':'')+'" onclick="toggleBrand(\''+b.id+'\')"></div><span>'+(b.available?'On':'Off')+'</span></div><button type="button" class="variant-rm" onclick="removeBrand(\''+b.id+'\')"><i class="fa-solid fa-trash"></i></button></div><div class="brand-colors-row"><div class="brand-colors-label">Pick colors for this brand</div>'+chips+'</div></div>';
  }
  el.innerHTML=html;
}

function handleProductFiles(input){
  var f=input.files;if(!f||!f.length)return;
  document.getElementById('productFileLabel').textContent='Tap to add more images';
  var existing=productImages.slice();productImages=[];
  for(var i=0;i<f.length;i++){(function(file){var url=URL.createObjectURL(file);productImages.push({local:true,file:file,url:url})})(f[i])}
  productImages=existing.concat(productImages);renderProductThumbs();
}
function renderProductThumbs(){
  var grid=document.getElementById('productThumbs');grid.innerHTML='';
  if(!productImages.length){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:12px;color:#64748B;font-size:11.5px;">No images yet</div>';return}
  for(var i=0;i<productImages.length;i++){
    var img=productImages[i];var url=(typeof img==='string')?img:img.url;
    var cell=document.createElement('div');cell.className='img-cell'+(i===0?' cover':'');cell.dataset.idx=i;
    cell.innerHTML='<img loading="lazy" decoding="async" src="'+url+'"><span class="num">'+(i+1)+'</span><button type="button" class="rm" onclick="event.stopPropagation();removeProductImage('+i+')"><i class="fa-solid fa-xmark"></i></button>'+(i===0?'<span class="badge">Cover</span>':'');
    grid.appendChild(cell);
  }
  attachImgDrag();
}
function removeProductImage(i){productImages.splice(i,1);renderProductThumbs()}

function attachImgDrag(){
  var grid=document.getElementById('productThumbs');
  var cells=grid.querySelectorAll('.img-cell');
  for(var k=0;k<cells.length;k++)cells[k].addEventListener('pointerdown',startImgDrag);
  function startImgDrag(e){
    if(e.target.classList.contains('rm'))return;e.preventDefault();
    var idx=parseInt(e.currentTarget.dataset.idx,10);
    var arr=Array.prototype.slice.call(grid.querySelectorAll('.img-cell'));
    var moved=arr[idx];if(!moved)return;
    var startX=e.clientX,startY=e.clientY;var rect=moved.getBoundingClientRect();
    var cellW=rect.width+10,cellH=rect.height+10;
    var perRow=Math.max(1,Math.floor(grid.getBoundingClientRect().width/cellW));var newIdx=idx;
    moved.classList.add('dragging-img');
    function onMove(ev){var dx=ev.clientX-startX,dy=ev.clientY-startY;moved.style.transform='translate('+dx+'px,'+dy+'px) scale(1.08)';var colShift=Math.round(dx/cellW),rowShift=Math.round(dy/cellH);newIdx=Math.max(0,Math.min(arr.length-1,idx+rowShift*perRow+colShift))}
    function onUp(){
      document.removeEventListener('pointermove',onMove);document.removeEventListener('pointerup',onUp);document.removeEventListener('pointercancel',onUp);
      for(var j=0;j<arr.length;j++){arr[j].style.transform='';arr[j].classList.remove('dragging-img')}
      if(newIdx===idx)return;
      var item=productImages.splice(idx,1)[0];productImages.splice(newIdx,0,item);renderProductThumbs();
    }
    document.addEventListener('pointermove',onMove,{passive:false});document.addEventListener('pointerup',onUp);document.addEventListener('pointercancel',onUp);
  }
}

function openBannerModal(data){
  document.getElementById('bannerModal').classList.add('show');
  document.getElementById('bannerFile').value='';document.getElementById('bannerPreview').style.display='none';
  document.getElementById('bannerFileLabel').textContent='Tap to choose';
  if(data){
    document.getElementById('bannerModalTitle').textContent='Edit Banner';
    document.getElementById('bannerEditId').value=data.id;
    document.getElementById('bannerLabel').value=data.label||'';
    document.getElementById('bannerTitle').value=data.title||'';
    document.getElementById('bannerDesc').value=data.desc||'';
    document.getElementById('bannerBtnText').value=data.btntext||'';
    document.getElementById('bannerBtnCategory').value=data.btncategory||'';
    document.getElementById('bannerImageUrl').value=data.image||'';
    document.getElementById('bannerImageAlt').value='';
    if(data.image){var p=document.getElementById('bannerPreview');p.src=data.image;p.style.display='block'}
  }else{
    document.getElementById('bannerModalTitle').textContent='Add Banner';
    document.getElementById('bannerForm').reset();
    document.getElementById('bannerEditId').value='';
    document.getElementById('bannerImageUrl').value='';
    document.getElementById('bannerImageAlt').value='';
  }
}
function closeModal(id){document.getElementById(id).classList.remove('show')}

async function saveBanner(e){
  e.preventDefault();
  showProgress('Saving banner','Please wait');updateProgress(10,'Preparing...');
  try{
    var imageUrl=document.getElementById('bannerImageUrl').value;
    var f=document.getElementById('bannerFile');
    if(f.files&&f.files.length){updateProgress(30,'Uploading image...');imageUrl=await uploadImage(f.files[0],0)}
    if(!imageUrl)throw new Error('Please add an image');
    updateProgress(70,'Reading...');
    var id=document.getElementById('bannerEditId').value;
    var rec={label:document.getElementById('bannerLabel').value||'',title:document.getElementById('bannerTitle').value||'',desc:document.getElementById('bannerDesc').value||'',btntext:document.getElementById('bannerBtnText').value||'',btncategory:document.getElementById('bannerBtnCategory').value||'',image:imageUrl};
    var fresh=await getJSON('banners.json');var base=Array.isArray(fresh)?fresh:banners;var updated;
    if(id){updated=base.map(function(b){return String(b.id)===String(id)?Object.assign({},b,rec):b})}
    else{var nid=base.length?Math.max.apply(null,base.map(function(b){return Number(b.id)||0}))+1:1;updated=base.concat([Object.assign({id:nid},rec)])}
    updateProgress(85,'Saving...');
    await pushFile('banners.json',toB64(JSON.stringify(updated,null,2)),id?'Update banner':'Add banner');
    updateProgress(100,'Done!');
    banners=updated;renderBanners();toast(id?'Banner updated':'Banner added');closeModal('bannerModal');
  }catch(err){toast('Error: '+err.message)}
  finally{setTimeout(hideProgress,400)}
}
function editBanner(id){var b=banners.filter(function(x){return String(x.id)===String(id)})[0];if(b)openBannerModal(b)}
async function deleteBanner(id){
  if(!confirm('Delete this banner?'))return;
  showProgress('Deleting...','Updating');
  try{
    var fresh=await getJSON('banners.json');var base=Array.isArray(fresh)?fresh:banners;
    var updated=base.filter(function(b){return String(b.id)!==String(id)});
    updateProgress(50,'Saving...');
    await pushFile('banners.json',toB64(JSON.stringify(updated,null,2)),'Delete banner');
    updateProgress(100,'Done!');banners=updated;renderBanners();toast('Banner deleted');
  }catch(e){toast('Error: '+e.message)}
  finally{setTimeout(hideProgress,400)}
}

function openProductModal(data){
  document.getElementById('productModal').classList.add('show');
  document.getElementById('productFiles').value='';
  document.getElementById('productFileLabel').textContent='Tap to add images';
  document.getElementById('productThumbs').innerHTML='';
  productImages=[];brands=[];colors=[];
  if(data){
    document.getElementById('productModalTitle').textContent='Edit Product';
    document.getElementById('productEditId').value=data.id;
    document.getElementById('productName').value=data.name||'';
    document.getElementById('productPrice').value=data.price||'';
    document.getElementById('productDiscount').value=data.discount||'';
    document.getElementById('productCategory').value=data.category||'Electronics';
    document.getElementById('productDesc').value=data.desc||'';
    document.getElementById('productSoldOut').checked=data.is_sold_out===true;
    productImages=getImgs(data).slice();
    colors=Array.isArray(data.colors)?data.colors.map(function(c){return Object.assign({},c)}):[];
    brands=Array.isArray(data.brands)?data.brands.map(function(b){var o=Object.assign({},b);if(!Array.isArray(o.colors))o.colors=[];return o}):[];
  }else{
    document.getElementById('productModalTitle').textContent='Add Product';
    document.getElementById('productForm').reset();
    document.getElementById('productEditId').value='';
    document.getElementById('productSoldOut').checked=false;
  }
  renderProductThumbs();renderColors();renderBrands();
}

async function saveProduct(e){
  e.preventDefault();
  showProgress('Saving product','Please wait');updateProgress(5,'Preparing...');
  try{
    var newUrls=[];
    var locals=productImages.filter(function(x){return typeof x!=='string'});
    var keeps=productImages.filter(function(x){return typeof x==='string'});
    if(locals.length){
      updateProgress(15,'Uploading '+locals.length+' image(s)...');
      for(var i=0;i<locals.length;i++){
        updateProgress(15+Math.round((i/locals.length)*55),'Uploading '+(i+1)+' of '+locals.length+'...');
        var url=await uploadImage(locals[i].file,i);
        newUrls.push(url);
      }
    }
    var all=keeps.concat(newUrls);
    if(!all.length)throw new Error('Add at least one image');
    updateProgress(75,'Reading...');
    var id=document.getElementById('productEditId').value;
    var cleanColors=colors.filter(function(c){return c.name.trim()}).map(function(c){return{id:c.id,name:c.name.trim(),available:c.available!==false}});
    var cleanBrands=brands.filter(function(b){return b.name.trim()}).map(function(b){var cIds=Array.isArray(b.colors)?b.colors.filter(function(cid){return cleanColors.some(function(c){return c.id===cid})}):[];return{id:b.id,name:b.name.trim(),available:b.available!==false,colors:cIds}});
    var rec={name:document.getElementById('productName').value,price:parseInt(document.getElementById('productPrice').value)||0,discount:parseInt(document.getElementById('productDiscount').value)||0,category:document.getElementById('productCategory').value,desc:document.getElementById('productDesc').value,is_sold_out:document.getElementById('productSoldOut').checked,image:all[0],images:all,brands:cleanBrands,colors:cleanColors};
    var fresh=await getJSON('products.json');var base=Array.isArray(fresh)?fresh:products;var updated;
    if(id){updated=base.map(function(p){return String(p.id)===String(id)?Object.assign({},p,rec):p})}
    else{var nid=base.length?Math.max.apply(null,base.map(function(p){return Number(p.id)||0}))+1:1;updated=base.concat([Object.assign({id:nid},rec)])}
    updateProgress(90,'Saving...');
    await pushFile('products.json',toB64(JSON.stringify(updated,null,2)),id?'Update product':'Add product');
    updateProgress(100,'Done!');
    products=updated;renderProducts();toast(id?'Product updated':'Product added');closeModal('productModal');
  }catch(err){toast('Error: '+err.message)}
  finally{setTimeout(hideProgress,400)}
}
function editProduct(id){var p=products.filter(function(x){return String(x.id)===String(id)})[0];if(p)openProductModal(p)}
async function deleteProduct(id){
  if(!confirm('Delete this product?'))return;
  showProgress('Deleting...','Updating');
  try{
    var fresh=await getJSON('products.json');var base=Array.isArray(fresh)?fresh:products;
    var updated=base.filter(function(p){return String(p.id)!==String(id)});
    updateProgress(50,'Saving...');
    await pushFile('products.json',toB64(JSON.stringify(updated,null,2)),'Delete product');
    updateProgress(100,'Done!');products=updated;renderProducts();toast('Product deleted');
  }catch(e){toast('Error: '+e.message)}
  finally{setTimeout(hideProgress,400)}
}

function exportData(){
  var d={banners:banners,products:products,notification:currentNotification,exportedAt:new Date().toISOString()};
  var b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});var u=URL.createObjectURL(b);
  var a=document.createElement('a');a.href=u;a.download='pge_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(u);toast('Backup downloaded');
}
function importData(){
  var inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=async function(ev){
      try{
        var d=JSON.parse(ev.target.result);
        if(!d.banners||!d.products)throw new Error('Invalid file');
        if(!confirm('Replace with '+d.products.length+' products and '+d.banners.length+' banners?'))return;
        showProgress('Importing...','Updating');updateProgress(30,'Banners...');
        await pushFile('banners.json',toB64(JSON.stringify(d.banners,null,2)),'Import banners');
        updateProgress(70,'Products...');
        await pushFile('products.json',toB64(JSON.stringify(d.products,null,2)),'Import products');
        updateProgress(100,'Done!');
        banners=d.banners;products=d.products;renderBanners();renderProducts();toast('Imported!');
      }catch(err){toast('Error: '+err.message)}
      finally{setTimeout(hideProgress,400)}
    };
    r.readAsText(f);
  };
  inp.click();
}

function showProgress(t,s){document.getElementById('progressTitle').textContent=t||'Saving...';document.getElementById('progressSub').textContent=s||'Please wait';document.getElementById('progressFill').style.width='0%';document.getElementById('progressStatus').textContent='Starting...';document.getElementById('progressOverlay').classList.add('show')}
function updateProgress(p,s){document.getElementById('progressFill').style.width=p+'%';if(s)document.getElementById('progressStatus').textContent=s}
function hideProgress(){document.getElementById('progressOverlay').classList.remove('show')}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show')},3000)}

var modals=document.querySelectorAll('.modal');
for(var mi=0;mi<modals.length;mi++)modals[mi].addEventListener('click',function(e){if(e.target===this)this.classList.remove('show')});
</script>
