<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PGE Shop - Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#f5b400;--dark:#101828;--text:#172033;--muted:#667085;--bg:#f7f8fa;--card:#fff;--border:#eaecf0;--green:#16a34a;--red:#ef4444}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);padding:20px;padding-bottom:80px}
#authOverlay{position:fixed;inset:0;background:var(--bg);z-index:10000;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px}
.auth-card{background:#fff;padding:32px 24px;border-radius:20px;box-shadow:0 12px 35px rgba(0,0,0,.08);width:100%;max-width:360px;text-align:center;border:1px solid var(--border)}
.auth-card h2{margin-bottom:24px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:20px;font-weight:800}
.auth-card h2 i{color:var(--primary)}
.auth-card input{width:100%;padding:14px;border:1px solid var(--border);border-radius:12px;margin-bottom:16px;font-family:inherit;font-size:13px;outline:none;transition:border-color .2s}
.auth-card input:focus{border-color:var(--primary)}
.auth-card button{width:100%;padding:14px;background:var(--primary);color:var(--dark);border:none;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;transition:transform .2s}
.auth-card button:active{transform:scale(.96)}
.auth-error{color:var(--red);font-size:13px;margin-top:12px;font-weight:600;display:none}
.admin-header{background:var(--dark);color:#fff;padding:16px 20px;border-radius:16px;margin-bottom:24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.admin-header h1{font-size:18px;display:flex;align-items:center;gap:10px}
.admin-header h1 i{color:var(--primary)}
.admin-header a{color:var(--primary);font-weight:700;font-size:13px;text-decoration:none}
.admin-section{background:var(--card);border-radius:16px;padding:20px;margin-bottom:24px;border:1px solid var(--border)}
.admin-section h2{font-size:16px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.admin-section h2 i{color:var(--primary)}
.btn{padding:8px 16px;border-radius:10px;font-weight:700;font-size:12px;border:none;cursor:pointer;transition:transform .2s;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:scale(.95)}
.btn-primary{background:var(--primary);color:var(--dark)}
.btn-success{background:var(--green);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:4px 10px;font-size:10px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:700;margin-bottom:4px;color:var(--muted)}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:13px;background:#fff}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--primary)}
.form-group textarea{resize:vertical;min-height:60px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checkbox-group{display:flex;align-items:center;gap:10px;background:#f8fafc;padding:12px;border-radius:10px;border:1px solid var(--border);cursor:pointer}
.checkbox-group input{width:18px;height:18px;accent-color:var(--red);cursor:pointer}
.checkbox-group label{margin:0;font-weight:700;color:var(--text);cursor:pointer}
.table-responsive{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
table th{text-align:left;padding:10px 8px;background:var(--bg);font-weight:700;border-bottom:2px solid var(--border)}
table td{padding:10px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
table td img{width:40px;height:40px;object-fit:cover;border-radius:6px}
.actions{display:flex;gap:4px;flex-wrap:wrap}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:9px;font-weight:700;background:var(--bg);color:var(--muted)}
.badge-sold{background:#fee2e2;color:var(--red)}
.badge-avail{background:#dcfce7;color:#16a34a}
.modal-overlay{position:fixed;inset:0;background:rgba(16,24,40,.6);backdrop-filter:blur(4px);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.show{display:flex}
.modal-card{background:#fff;border-radius:20px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;padding:24px;position:relative;animation:modalIn .3s ease}
@keyframes modalIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal-card h3{font-size:16px;font-weight:800;margin-bottom:16px}
.modal-close{position:absolute;top:12px;right:12px;background:var(--bg);border:none;width:32px;height:32px;border-radius:50%;font-size:14px;cursor:pointer}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 20px;border-radius:12px;font-weight:600;font-size:12px;z-index:2000;display:none;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90%;text-align:center}
.toast.show{display:block;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateX(-50%) translateY(20px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
.empty-state{text-align:center;padding:30px 20px;color:var(--muted)}
.empty-state i{font-size:32px;margin-bottom:8px;color:#d0d5dd}
@media(max-width:600px){.form-row{grid-template-columns:1fr}.admin-header{flex-direction:column;align-items:stretch;text-align:center}}
</style>
</head>
<body>

<div id="authOverlay">
<div class="auth-card">
<h2><i class="fa-solid fa-lock"></i> Admin Locked</h2>
<input type="password" id="adminPasswordInput" placeholder="Enter security password">
<input type="password" id="tokenInput" placeholder="Paste GitHub token (github_pat_...)">
<button onclick="verifyAdmin()"><i class="fa-solid fa-unlock"></i> Unlock Dashboard</button>
<div id="authErrorMsg" class="auth-error">Incorrect password. Access denied.</div>
</div>
</div>

<div class="admin-header">
<h1><i class="fa-solid fa-crown"></i> PGE Shop Admin</h1>
<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
<a href="#" onclick="exportData()"><i class="fa-solid fa-download"></i> Export</a>
<a href="#" onclick="importData()"><i class="fa-solid fa-upload"></i> Import</a>
<a href="#" onclick="changeToken()"><i class="fa-solid fa-key"></i> Token</a>
<a href="index.html" target="_blank"><i class="fa-solid fa-eye"></i> View</a>
</div>
</div>

<div id="toast" class="toast"></div>

<div class="admin-section">
<h2><i class="fa-solid fa-image"></i> Manage Banners</h2>
<button class="btn btn-primary" onclick="openBannerModal()"><i class="fa-solid fa-plus"></i> Add Banner</button>
<div style="margin-top:12px;">
<div class="table-responsive">
<table>
<thead><tr><th>Image</th><th>Label</th><th>Title</th><th>Actions</th></tr></thead>
<tbody id="bannerTableBody"><tr><td colspan="4"><div class="empty-state"><p>Loading...</p></div></td></tr></tbody>
</table>
</div>
</div>
</div>

<div class="admin-section">
<h2><i class="fa-solid fa-box"></i> Manage Products</h2>
<button class="btn btn-primary" onclick="openProductModal()"><i class="fa-solid fa-plus"></i> Add Product</button>
<div style="margin-top:12px;">
<div class="table-responsive">
<table>
<thead><tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead>
<tbody id="productTableBody"><tr><td colspan="6"><div class="empty-state"><p>Loading...</p></div></td></tr></tbody>
</table>
</div>
</div>
</div>

<div id="bannerModal" class="modal-overlay">
<div class="modal-card">
<button class="modal-close" onclick="closeModal('bannerModal')"><i class="fa-solid fa-xmark"></i></button>
<h3 id="bannerModalTitle">Add Banner</h3>
<form id="bannerForm" onsubmit="saveBanner(event)">
<input type="hidden" id="bannerEditId">
<input type="hidden" id="bannerImageUrl">
<div class="form-group">
<label>Upload Banner Image (from Phone/Laptop)</label>
<input type="file" id="bannerFile" accept="image/*" onchange="previewImage(this,'bannerPreview','bannerImageUrl')">
<div style="margin-top:8px;"><img id="bannerPreview" style="max-width:100px;max-height:60px;object-fit:cover;border-radius:6px;display:none" alt="Preview"></div>
</div>
<div class="form-group">
<label>Or Image URL</label>
<input type="url" id="bannerImageAlt" placeholder="https://..." oninput="document.getElementById('bannerImageUrl').value=this.value;document.getElementById('bannerPreview').src=this.value;document.getElementById('bannerPreview').style.display=this.value?'block':'none'">
</div>
<div class="form-group"><label>Label (e.g., Electronics Deal)</label><input type="text" id="bannerLabel" placeholder="Electronics Deal"></div>
<div class="form-group"><label>Title (e.g., Upgrade Your Lifestyle)</label><input type="text" id="bannerTitle" placeholder="Upgrade Your Lifestyle"></div>
<div class="form-group"><label>Description</label><input type="text" id="bannerDesc" placeholder="Discover quality electronics..."></div>
<div class="form-group"><label>Button Text (e.g., Shop Electronics)</label><input type="text" id="bannerBtnText" placeholder="Shop Electronics"></div>
<div class="form-group"><label>Button Category (e.g., Electronics)</label><input type="text" id="bannerBtnCategory" placeholder="Electronics"></div>
<button type="submit" class="btn btn-success" style="width:100%;justify-content:center;padding:12px;"><i class="fa-solid fa-save"></i> Save Banner</button>
</form>
</div>
</div>

<div id="productModal" class="modal-overlay">
<div class="modal-card">
<button class="modal-close" onclick="closeModal('productModal')"><i class="fa-solid fa-xmark"></i></button>
<h3 id="productModalTitle">Add Product</h3>
<form id="productForm" onsubmit="saveProduct(event)">
<input type="hidden" id="productEditId">
<input type="hidden" id="productImageUrl">
<div class="form-group"><label>Product Name *</label><input type="text" id="productName" required placeholder="Smart 4K Ultra HD TV 55"></div>
<div class="form-row">
<div class="form-group"><label>Price (₦) *</label><input type="number" id="productPrice" required placeholder="320000"></div>
<div class="form-group"><label>Discount %</label><input type="number" id="productDiscount" placeholder="15" min="0" max="100"></div>
</div>
<div class="form-group">
<label>Category *</label>
<select id="productCategory" required>
<option value="Electronics">Electronics</option>
<option value="Phones">Phones</option>
<option value="Laptop">Laptop</option>
<option value="Fashion">Fashion</option>
</select>
</div>
<div class="form-group"><label>Description *</label><textarea id="productDesc" required placeholder="Crystal clear 4K display..."></textarea></div>
<div class="form-group">
<div class="checkbox-group">
<input type="checkbox" id="productSoldOut">
<label for="productSoldOut">Mark as Sold Out (Disables Cart & Details)</label>
</div>
</div>
<div class="form-group">
<label>Upload Product Image (from Phone/Laptop)</label>
<input type="file" id="productFile" accept="image/*" onchange="previewImage(this,'productPreview','productImageUrl')">
<div style="margin-top:8px;"><img id="productPreview" style="max-width:80px;max-height:80px;object-fit:cover;border-radius:6px;display:none" alt="Preview"></div>
</div>
<div class="form-group">
<label>Or Image URL</label>
<input type="url" id="productImageAlt" placeholder="https://..." oninput="document.getElementById('productImageUrl').value=this.value;document.getElementById('productPreview').src=this.value;document.getElementById('productPreview').style.display=this.value?'block':'none'">
</div>
<button type="submit" class="btn btn-success" style="width:100%;justify-content:center;padding:12px;"><i class="fa-solid fa-save"></i> Save Product</button>
</form>
</div>
</div>

<script>
/* =============================================
   GITHUB CONFIG
============================================= */
const GH_USER   = 'nafisaaliyuhabeeb-crypto';
const GH_REPO   = 'pge-shop';
const GH_BRANCH = 'main';
const DATA_BASE = 'https://raw.githubusercontent.com/' + GH_USER + '/' + GH_REPO + '/' + GH_BRANCH;
const API_BASE  = 'https://api.github.com/repos/' + GH_USER + '/' + GH_REPO + '/contents';

function getToken(){ return localStorage.getItem('pge_github_token') || ''; }
function setToken(t){ localStorage.setItem('pge_github_token', t); }

function changeToken(){
  const current = getToken() ? '(saved)' : '(none)';
  const t = prompt('Current token ' + current + '. Paste a new one (or Cancel):', '');
  if(t === null) return;
  if(t.trim()){ setToken(t.trim()); showToast('Token updated!'); }
}

/* =============================================
   AUTH
============================================= */
const ADMIN_SECURE_PASSWORD = 'admin5677*#*#@';
const INACTIVITY_LIMIT_MS = 120000;
let isAppUnlocked = false;
let inactivityTimer;

function verifyAdmin(){
  const passVal  = document.getElementById('adminPasswordInput').value;
  const tokenVal = document.getElementById('tokenInput').value.trim();

  if(passVal !== ADMIN_SECURE_PASSWORD){
    document.getElementById('authErrorMsg').textContent = 'Incorrect password.';
    document.getElementById('authErrorMsg').style.display = 'block';
    return;
  }

  if(tokenVal) setToken(tokenVal);

  if(!getToken()){
    document.getElementById('authErrorMsg').textContent = 'Paste your GitHub token (github_pat_...).';
    document.getElementById('authErrorMsg').style.display = 'block';
    return;
  }

  document.getElementById('authOverlay').style.display = 'none';
  document.getElementById('authErrorMsg').style.display = 'none';
  document.getElementById('adminPasswordInput').value = '';
  document.getElementById('tokenInput').value = '';
  isAppUnlocked = true;
  resetInactivityTimer();
  fetchData();
}

function lockDashboard(){
  document.getElementById('authOverlay').style.display = 'flex';
  isAppUnlocked = false;
  clearTimeout(inactivityTimer);
  // Pre-fill the token box so user can see it's saved
  setTimeout(function(){
    var ti = document.getElementById('tokenInput');
    if(ti){
      var saved = getToken();
      if(saved){ ti.value = saved; ti.placeholder = '(token already saved)'; }
    }
  }, 50);
}

function resetInactivityTimer(){
  if(!isAppUnlocked) return;
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(lockDashboard, INACTIVITY_LIMIT_MS);
}
['mousemove','keydown','click','scroll','touchstart'].forEach(function(evt){
  document.addEventListener(evt, resetInactivityTimer);
});
document.addEventListener('visibilitychange', function(){ if(document.hidden) lockDashboard(); });
lockDashboard();

/* =============================================
   STATE
============================================= */
let banners = [];
let products = [];

/* =============================================
   BASE64 HELPERS
============================================= */
function toBase64(str){ return btoa(unescape(encodeURIComponent(str))); }
function fileToBase64(file){
  return new Promise(function(resolve, reject){
    var r = new FileReader();
    r.readAsDataURL(file);
    r.onload = function(){ resolve(r.result.split(',')[1]); };
    r.onerror = reject;
  });
}

/* =============================================
   GITHUB API
============================================= */
async function getFileSha(path){
  var token = getToken();
  if(!token) return null;
  try{
    var res = await fetch(API_BASE + '/' + path + '?ref=' + GH_BRANCH, {
      headers:{ 'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json' }
    });
    if(res.status === 404) return null;
    if(!res.ok) return null;
    var d = await res.json();
    return d.sha;
  }catch(e){ return null; }
}

async function uploadFileToGitHub(path, base64Content, message){
  var token = getToken();
  if(!token) throw new Error('No GitHub token set. Tap "Token" in the header.');
  var sha = await getFileSha(path);
  var body = { message: message, content: base64Content, branch: GH_BRANCH };
  if(sha) body.sha = sha;
  var res = await fetch(API_BASE + '/' + path, {
    method: 'PUT',
    headers:{
      'Authorization': 'Bearer ' + token,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });
  if(!res.ok){
    var err = {};
    try{ err = await res.json(); }catch(e){}
    throw new Error(err.message || ('GitHub error ' + res.status));
  }
  return await res.json();
}

/* =============================================
   IMAGE UPLOAD
============================================= */
async function uploadImageFile(fileInputId){
  var input = document.getElementById(fileInputId);
  if(!input || !input.files || !input.files.length) return null;
  var file = input.files[0];
  var safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
  var fileName = Date.now() + '_' + safeName;
  var path = 'images/' + fileName;
  var base64 = await fileToBase64(file);
  await uploadFileToGitHub(path, base64, 'Upload image ' + fileName);
  return 'https://raw.githubusercontent.com/' + GH_USER + '/' + GH_REPO + '/' + GH_BRANCH + '/' + path;
}

function previewImage(input, previewId, urlFieldId){
  if(input.files && input.files[0]){
    var reader = new FileReader();
    reader.onload = function(e){
      var preview = document.getElementById(previewId);
      preview.src = e.target.result;
      preview.style.display = 'block';
      document.getElementById(urlFieldId).value = '';
    };
    reader.readAsDataURL(input.files[0]);
  }
}

/* =============================================
   FETCH DATA
============================================= */
async function fetchData(){
  try{
    var t = '?t=' + Date.now();
    var bR = await fetch(DATA_BASE + '/banners.json' + t).catch(function(){ return null; });
    var pR = await fetch(DATA_BASE + '/products.json' + t).catch(function(){ return null; });
    banners  = (bR && bR.ok) ? await bR.json() : [];
    products = (pR && pR.ok) ? await pR.json() : [];
    if(!Array.isArray(banners)) banners = [];
    if(!Array.isArray(products)) products = [];
    renderBanners();
    renderProducts();
  }catch(e){
    showToast('Error loading: ' + e.message);
  }
}

/* =============================================
   RENDER
============================================= */
function renderBanners(){
  var tbody = document.getElementById('bannerTableBody');
  if(!banners.length){
    tbody.innerHTML = '<tr><td colspan="4"><div class="empty-state"><i class="fa-solid fa-image"></i><p>No banners added yet</p></div></td></tr>';
    return;
  }
  tbody.innerHTML = banners.map(function(b){
    return '<tr>' +
      '<td><img src="' + (b.image || '') + '" onerror="this.src=\'https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?w=200&q=60\'"></td>' +
      '<td><strong>' + (b.label || '-') + '</strong></td>' +
      '<td>' + (b.title || '-') + '</td>' +
      '<td><div class="actions">' +
        '<button class="btn btn-primary btn-sm" onclick="editBanner(' + b.id + ')"><i class="fa-solid fa-pen"></i></button>' +
        '<button class="btn btn-danger btn-sm" onclick="deleteBanner(' + b.id + ')"><i class="fa-solid fa-trash"></i></button>' +
      '</div></td>' +
    '</tr>';
  }).join('');
}

function renderProducts(){
  var tbody = document.getElementById('productTableBody');
  if(!products.length){
    tbody.innerHTML = '<tr><td colspan="6"><div class="empty-state"><i class="fa-solid fa-box-open"></i><p>No products added yet</p></div></td></tr>';
    return;
  }
  tbody.innerHTML = products.map(function(p){
    return '<tr>' +
      '<td><img src="' + (p.image || '') + '" onerror="this.src=\'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=200&q=60\'"></td>' +
      '<td><strong>' + p.name + '</strong></td>' +
      '<td><span class="badge">' + p.category + '</span></td>' +
      '<td>₦' + (p.price ? Number(p.price).toLocaleString() : 0) + '</td>' +
      '<td>' + (p.is_sold_out ? '<span class="badge badge-sold">Sold Out</span>' : '<span class="badge badge-avail">Available</span>') + '</td>' +
      '<td><div class="actions">' +
        '<button class="btn btn-primary btn-sm" onclick="editProduct(' + p.id + ')"><i class="fa-solid fa-pen"></i></button>' +
        '<button class="btn btn-danger btn-sm" onclick="deleteProduct(' + p.id + ')"><i class="fa-solid fa-trash"></i></button>' +
      '</div></td>' +
    '</tr>';
  }).join('');
}

/* =============================================
   BANNER CRUD
============================================= */
function openBannerModal(data){
  document.getElementById('bannerModal').classList.add('show');
  document.getElementById('bannerFile').value = '';
  document.getElementById('bannerPreview').style.display = 'none';
  if(data){
    document.getElementById('bannerModalTitle').textContent = 'Edit Banner';
    document.getElementById('bannerEditId').value = data.id;
    document.getElementById('bannerLabel').value = data.label || '';
    document.getElementById('bannerTitle').value = data.title || '';
    document.getElementById('bannerDesc').value = data.desc || '';
    document.getElementById('bannerBtnText').value = data.btntext || '';
    document.getElementById('bannerBtnCategory').value = data.btncategory || '';
    document.getElementById('bannerImageUrl').value = data.image || '';
    document.getElementById('bannerImageAlt').value = '';
    if(data.image){
      var prev = document.getElementById('bannerPreview');
      prev.src = data.image;
      prev.style.display = 'block';
    }
  } else {
    document.getElementById('bannerModalTitle').textContent = 'Add Banner';
    document.getElementById('bannerForm').reset();
    document.getElementById('bannerEditId').value = '';
    document.getElementById('bannerImageUrl').value = '';
    document.getElementById('bannerImageAlt').value = '';
  }
}

function closeModal(id){ document.getElementById(id).classList.remove('show'); }

async function saveBanner(e){
  e.preventDefault();
  var btn = e.target.querySelector('button[type="submit"]');
  var ogText = btn.innerHTML;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Uploading & Saving...';
  btn.disabled = true;
  try{
    var imageUrl = document.getElementById('bannerImageUrl').value;
    var uploadedUrl = await uploadImageFile('bannerFile');
    if(uploadedUrl) imageUrl = uploadedUrl;
    if(!imageUrl) throw new Error('Please provide an image or upload a file.');

    var id = document.getElementById('bannerEditId').value;
    var rec = {
      label: document.getElementById('bannerLabel').value || '',
      title: document.getElementById('bannerTitle').value || '',
      desc: document.getElementById('bannerDesc').value || '',
      btntext: document.getElementById('bannerBtnText').value || '',
      btncategory: document.getElementById('bannerBtnCategory').value || '',
      image: imageUrl
    };

    var updated;
    if(id){
      updated = banners.map(function(b){ return String(b.id) === String(id) ? Object.assign({}, b, rec) : b; });
    } else {
      var newId = banners.length ? Math.max.apply(null, banners.map(function(b){ return Number(b.id) || 0; })) + 1 : 1;
      updated = banners.concat([Object.assign({ id: newId }, rec)]);
    }

    var b64 = toBase64(JSON.stringify(updated, null, 2));
    await uploadFileToGitHub('banners.json', b64, id ? ('Update banner ' + id) : 'Add new banner');
    showToast(id ? 'Banner updated!' : 'Banner added!');
    await fetchData();
    closeModal('bannerModal');
  }catch(err){
    showToast('Error: ' + err.message);
  }finally{
    btn.innerHTML = ogText;
    btn.disabled = false;
  }
}

function editBanner(id){
  var b = banners.find(function(x){ return String(x.id) === String(id); });
  if(b) openBannerModal(b);
}

async function deleteBanner(id){

/* =============================================
   PRODUCT CRUD
============================================= */
function openProductModal(data){
  document.getElementById('productModal').classList.add('show');
  document.getElementById('productFile').value = '';
  document.getElementById('productPreview').style.display = 'none';
  if(data){
    document.getElementById('productModalTitle').textContent = 'Edit Product';
    document.getElementById('productEditId').value = data.id;
    document.getElementById('productName').value = data.name || '';
    document.getElementById('productPrice').value = data.price || '';
    document.getElementById('productDiscount').value = data.discount || '';
    document.getElementById('productCategory').value = data.category || 'Electronics';
    document.getElementById('productDesc').value = data.desc || '';
    document.getElementById('productSoldOut').checked = data.is_sold_out === true;
    document.getElementById('productImageUrl').value = data.image || '';
    document.getElementById('productImageAlt').value = '';
    if(data.image){
      var prev = document.getElementById('productPreview');
      prev.src = data.image;
      prev.style.display = 'block';
    }
  } else {
    document.getElementById('productModalTitle').textContent = 'Add Product';
    document.getElementById('productForm').reset();
    document.getElementById('productEditId').value = '';
    document.getElementById('productImageUrl').value = '';
    document.getElementById('productImageAlt').value = '';
    document.getElementById('productSoldOut').checked = false;
  }
}

async function saveProduct(e){
  e.preventDefault();
  var btn = e.target.querySelector('button[type="submit"]');
  var ogText = btn.innerHTML;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Uploading & Saving...';
  btn.disabled = true;
  try{
    var imageUrl = document.getElementById('productImageUrl').value;
    var uploadedUrl = await uploadImageFile('productFile');
    if(uploadedUrl) imageUrl = uploadedUrl;
    if(!imageUrl) throw new Error('Please provide an image or upload a file.');

    var id = document.getElementById('productEditId').value;
    var rec = {
      name: document.getElementById('productName').value,
      price: parseInt(document.getElementById('productPrice').value) || 0,
      discount: parseInt(document.getElementById('productDiscount').value) || 0,
      category: document.getElementById('productCategory').value,
      desc: document.getElementById('productDesc').value,
      is_sold_out: document.getElementById('productSoldOut').checked,
      image: imageUrl
    };

    var updated;
    if(id){
      updated = products.map(function(p){ return String(p.id) === String(id) ? Object.assign({}, p, rec) : p; });
    } else {
      var newId = products.length ? Math.max.apply(null, products.map(function(p){ return Number(p.id) || 0; })) + 1 : 1;
      updated = products.concat([Object.assign({ id: newId }, rec)]);
    }

    var b64 = toBase64(JSON.stringify(updated, null, 2));
    await uploadFileToGitHub('products.json', b64, id ? ('Update product ' + id) : 'Add new product');
    showToast(id ? 'Product updated!' : 'Product added!');
    await fetchData();
    closeModal('productModal');
  }catch(err){
    showToast('Error: ' + err.message);
  }finally{
    btn.innerHTML = ogText;
    btn.disabled = false;
  }
}

function editProduct(id){
  var p = products.find(function(x){ return String(x.id) === String(id); });
  if(p) openProductModal(p);
}

async function deleteProduct(id){
  if(!confirm('Delete this product?')) return;
  try{
    var updated = products.filter(function(p){ return String(p.id) !== String(id); });
    var b64 = toBase64(JSON.stringify(updated, null, 2));
    await uploadFileToGitHub('products.json', b64, 'Delete product ' + id);
    showToast('Product deleted!');
    await fetchData();
  }catch(e){
    showToast('Error: ' + e.message);
  }
}

/* =============================================
   EXPORT / IMPORT
============================================= */
function exportData(){
  var data = { banners: banners, products: products, exportedAt: new Date().toISOString() };
  var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'pge_backup_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Backup downloaded!');
}

function importData(){
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = async function(e){
    var file = e.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = async function(ev){
      try{
        var data = JSON.parse(ev.target.result);
        if(!data.banners || !data.products) throw new Error('Invalid backup file');
        if(!confirm('Replace current data with ' + data.products.length + ' products and ' + data.banners.length + ' banners?')) return;
        await uploadFileToGitHub('banners.json', toBase64(JSON.stringify(data.banners, null, 2)), 'Import banners');
        await uploadFileToGitHub('products.json', toBase64(JSON.stringify(data.products, null, 2)), 'Import products');
        showToast('Imported successfully!');
        await fetchData();
      }catch(err){
        showToast('Import error: ' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

/* =============================================
   TOAST
============================================= */
function showToast(msg){
  var toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(function(){ toast.classList.remove('show'); }, 3500);
}

document.querySelectorAll('.modal-overlay').forEach(function(el){
  el.addEventListener('click', function(e){
    if(e.target === this) this.classList.remove('show');
  });
});
</script>
