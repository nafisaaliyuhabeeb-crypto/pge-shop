<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>PGE Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { font-family:'Inter',-apple-system,system-ui,sans-serif; background:#0f172a; color:#f1f5f9; min-height:100vh; padding:16px; }
        .admin-container { max-width:560px; margin:0 auto; padding-bottom:40px; }

        .toast-container { position:fixed; top:12px; left:50%; transform:translateX(-50%); z-index:9999; width:90%; max-width:400px; pointer-events:none; display:flex; flex-direction:column; align-items:center; gap:8px; }
        .toast { background:#1e293b; color:#f1f5f9; padding:14px 20px; border-radius:14px; font-weight:600; font-size:.9rem; box-shadow:0 10px 30px rgba(0,0,0,0.5); display:flex; align-items:center; gap:12px; animation:toastIn .3s cubic-bezier(.16,1,.3,1); border-left:4px solid #2563eb; width:100%; }
        .toast.success { border-left-color:#22c55e; }
        .toast.error { border-left-color:#ef4444; }
        .toast.info { border-left-color:#3b82f6; }
        @keyframes toastIn { from{ opacity:0; transform:translateY(-20px) scale(.95); } to{ opacity:1; transform:translateY(0) scale(1); } }

        .admin-header { display:flex; justify-content:space-between; align-items:center; padding:16px 0 20px; border-bottom:1px solid #1e293b; margin-bottom:20px; }
        .admin-header h1 { font-size:1.2rem; font-weight:700; }
        .admin-header h1 i { color:#2563eb; margin-right:8px; }
        .admin-header .badge { background:#2563eb; color:#fff; font-size:.65rem; font-weight:700; padding:4px 12px; border-radius:30px; }
        .admin-header .logout-btn { background:transparent; border:1px solid #ef4444; color:#ef4444; padding:8px 16px; border-radius:30px; font-weight:600; font-size:.8rem; cursor:pointer; transition:all .2s; }
        .admin-header .logout-btn:active { transform:scale(.95); }

        .login-box { background:#1e293b; border-radius:20px; padding:40px 28px; border:1px solid #334155; max-width:400px; margin:40px auto; text-align:center; }
        .login-box h2 { font-size:1.3rem; margin-bottom:8px; }
        .login-box p { color:#94a3b8; margin-bottom:24px; font-size:.9rem; }
        .login-box input { width:100%; padding:14px 16px; border-radius:12px; border:1px solid #334155; background:#0f172a; color:#f1f5f9; font-size:1rem; margin-bottom:16px; outline:none; text-align:center; letter-spacing:.1em; }
        .login-box input:focus { border-color:#2563eb; }
        .login-box button { width:100%; padding:14px; border-radius:12px; border:none; background:#2563eb; color:#fff; font-weight:700; font-size:1rem; cursor:pointer; transition:all .2s; }
        .login-box button:active { transform:scale(.97); }
        .login-box .error { color:#ef4444; font-size:.85rem; margin-top:8px; display:none; }

        .stats-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:24px; }
        .stat-card { background:#1e293b; border-radius:12px; padding:16px; border:1px solid #334155; text-align:center; }
        .stat-card .num { font-size:2rem; font-weight:800; color:#2563eb; }
        .stat-card .label { font-size:.75rem; color:#94a3b8; font-weight:500; }

        .tabs { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
        .tabs button { padding:10px 20px; border-radius:40px; border:1px solid #334155; background:#1e293b; color:#94a3b8; font-weight:600; font-size:.85rem; cursor:pointer; transition:all .2s; flex:1; min-width:80px; }
        .tabs button.active { background:#2563eb; color:#fff; border-color:#2563eb; }
        .tabs button:active { transform:scale(.97); }

        .admin-card { background:#1e293b; border-radius:12px; padding:14px 16px; border:1px solid #334155; margin-bottom:10px; display:flex; align-items:center; gap:14px; }
        .admin-card .info { flex:1; }
        .admin-card .info .title { font-weight:600; font-size:.9rem; color:#f1f5f9; }
        .admin-card .info .sub { font-size:.75rem; color:#94a3b8; }
        .admin-card .actions { display:flex; gap:6px; }
        .admin-card .actions button { padding:6px 12px; border-radius:30px; border:none; font-weight:600; font-size:.7rem; cursor:pointer; transition:all .2s; }
        .admin-card .actions .edit-btn { background:#2563eb; color:#fff; }
        .admin-card .actions .delete-btn { background:#ef4444; color:#fff; }
        .admin-card .actions button:active { transform:scale(.95); }
        .admin-card .thumb { width:44px; height:44px; border-radius:8px; object-fit:cover; background:#0f172a; flex-shrink:0; }

        .admin-form { background:#1e293b; border-radius:12px; padding:20px; border:1px solid #334155; margin-bottom:20px; }
        .admin-form h4 { margin-bottom:14px; font-size:1rem; }
        .admin-form .form-group { margin-bottom:12px; }
        .admin-form .form-group label { display:block; font-weight:600; font-size:.75rem; color:#94a3b8; margin-bottom:4px; }
        .admin-form .form-group input, .admin-form .form-group select, .admin-form .form-group textarea { width:100%; padding:12px 14px; border-radius:12px; border:1px solid #334155; font-size:.9rem; outline:none; background:#0f172a; color:#f1f5f9; font-family:inherit; }
        .admin-form .form-group input:focus, .admin-form .form-group select:focus, .admin-form .form-group textarea:focus { border-color:#2563eb; }
        .admin-form .form-group textarea { resize:vertical; min-height:60px; }
        .admin-form .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .admin-form .submit-btn { padding:12px 24px; border-radius:12px; border:none; background:#2563eb; color:#fff; font-weight:700; font-size:.9rem; cursor:pointer; transition:all .2s; width:100%; }
        .admin-form .submit-btn:active { transform:scale(.97); }
        .admin-form .cancel-btn { padding:12px 24px; border-radius:12px; border:1px solid #334155; background:transparent; color:#94a3b8; font-weight:600; font-size:.9rem; cursor:pointer; transition:all .2s; width:100%; margin-top:8px; }

        .danger-btn { padding:12px 20px; border-radius:12px; border:none; background:#ef4444; color:#fff; font-weight:700; font-size:.85rem; cursor:pointer; transition:all .2s; display:inline-flex; align-items:center; gap:8px; width:100%; justify-content:center; }
        .danger-btn:active { transform:scale(.97); }
        .danger-btn i { font-size:1rem; }
        .danger-btn:hover { background:#dc2626; }

        .section-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px; }
        .section-header h4 { color:#f1f5f9; font-size:.95rem; }
        .add-btn { padding:8px 16px; border-radius:30px; border:none; background:#2563eb; color:#fff; font-weight:600; font-size:.8rem; cursor:pointer; transition:all .2s; }
        .add-btn:active { transform:scale(.95); }
        .add-btn i { margin-right:6px; }

        .empty-state { text-align:center; padding:32px 16px; color:#94a3b8; }
        .empty-state i { font-size:2.5rem; margin-bottom:8px; opacity:.5; }

        .back-link { display:inline-flex; align-items:center; gap:8px; color:#94a3b8; text-decoration:none; font-weight:600; font-size:.9rem; margin-bottom:16px; transition:color .2s; }
        .back-link:hover { color:#f1f5f9; }
        .loading-spinner { text-align:center; padding:40px; color:#94a3b8; }
        .loading-spinner i { font-size:2rem; animation:spin 1s linear infinite; }
        @keyframes spin { from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }

        @media (max-width:480px) {
            .admin-form .form-row { grid-template-columns:1fr; }
            .stats-grid { grid-template-columns:1fr 1fr; }
            .tabs button { font-size:.7rem; padding:8px 12px; min-width:60px; }
            .admin-card { flex-wrap:wrap; }
            .admin-card .actions { margin-left:auto; }
        }
    </style>
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>

    <div class="admin-container" id="adminContainer">
        <!-- Rendered by JS -->
    </div>

    <script>
        // ============================================================
        //  CLOUD API - NO SETUP REQUIRED!
        //  Data is stored permanently using a free cloud database
        // ============================================================

        const API_URL = 'https://pge-shop-api.onrender.com';

        // Admin password (hardcoded)
        const ADMIN_PASSWORD = 'admin123';

        let products = [], slides = [];
        let isLoggedIn = false, currentTab = 'products', isLoading = true;

        // ============================================================
        //  API FUNCTIONS
        // ============================================================

        async function apiFetch(endpoint, options = {}) {
            try {
                const response = await fetch(`${API_URL}${endpoint}`, {
                    headers: { 'Content-Type': 'application/json' },
                    ...options
                });
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                return null;
            }
        }

        async function getProducts() {
            const result = await apiFetch('/products');
            return result?.data || [];
        }

        async function addProduct(product) {
            const result = await apiFetch('/products', {
                method: 'POST',
                body: JSON.stringify(product)
            });
            return result?.data;
        }

        async function updateProduct(id, product) {
            const result = await apiFetch('/products', {
                method: 'PUT',
                body: JSON.stringify({ id, ...product })
            });
            return result?.data;
        }

        async function deleteProduct(id) {
            const result = await apiFetch('/products', {
                method: 'DELETE',
                body: JSON.stringify({ id })
            });
            return result?.data;
        }

        async function deleteAllProducts() {
            const result = await apiFetch('/products/all', {
                method: 'DELETE'
            });
            return result?.data;
        }

        async function getSlides() {
            const result = await apiFetch('/slides');
            return result?.data || [];
        }

        async function addSlide(slide) {
            const result = await apiFetch('/slides', {
                method: 'POST',
                body: JSON.stringify(slide)
            });
            return result?.data;
        }

        async function updateSlide(id, slide) {
            const result = await apiFetch('/slides', {
                method: 'PUT',
                body: JSON.stringify({ id, ...slide })
            });
            return result?.data;
        }

        async function deleteSlide(id) {
            const result = await apiFetch('/slides', {
                method: 'DELETE',
                body: JSON.stringify({ id })
            });
            return result?.data;
        }

        async function deleteAllSlides() {
            const result = await apiFetch('/slides/all', {
                method: 'DELETE'
            });
            return result?.data;
        }

        // ============================================================
        //  APP LOGIC
        // ============================================================

        function formatPrice(n) { return '₦' + Number(n).toLocaleString(); }
        function getProduct(id) { return products.find(p => p.id === id); }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = { success: 'fa-circle-check', error: 'fa-circle-xmark', info: 'fa-circle-info' };
            toast.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i> ${message}`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 1500);
        }

        function renderAdmin() {
            const container = document.getElementById('adminContainer');

            if (!isLoggedIn) {
                container.innerHTML = `
                <div class="login-box">
                  <h2><i class="fas fa-user-shield" style="color:#2563eb;margin-right:8px;"></i>Admin Access</h2>
                  <p>Enter your password to manage the store.</p>
                  <input type="password" id="adminLoginInput" placeholder="Enter password" />
                  <button onclick="login()">Unlock Admin Panel</button>
                  <div class="error" id="loginError">Incorrect password. Try again.</div>
                </div>
                <div style="text-align:center;margin-top:16px;">
                  <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Store</a>
                </div>
              `;
                return;
            }

            if (isLoading) {
                container.innerHTML = `<div class="loading-spinner"><i class="fas fa-spinner"></i><br>Loading data...</div>`;
                return;
            }

            const totalProducts = products.length;
            const totalSlides = slides.length;

            container.innerHTML = `
              <div class="admin-header">
                <h1><i class="fas fa-store-alt"></i> PGE Admin</h1>
                <div>
                  <span class="badge">v1.0</span>
                  <button class="logout-btn" onclick="logout()" style="margin-left:8px;"><i class="fas fa-sign-out-alt"></i> Logout</button>
                </div>
              </div>

              <div class="stats-grid">
                <div class="stat-card"><div class="num">${totalProducts}</div><div class="label">Products</div></div>
                <div class="stat-card"><div class="num">${totalSlides}</div><div class="label">Banners</div></div>
              </div>

              <div class="tabs">
                <button class="${currentTab === 'products' ? 'active' : ''}" onclick="switchTab('products')">Products</button>
                <button class="${currentTab === 'banners' ? 'active' : ''}" onclick="switchTab('banners')">Banners</button>
              </div>

              <div id="tabContent">
                ${currentTab === 'products' ? renderProductsTab() : renderBannersTab()}
              </div>

              <div style="text-align:center;margin-top:20px;">
                <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Store</a>
              </div>
            `;
        }

        // ============================================================
        //  PRODUCTS TAB
        // ============================================================

        function renderProductsTab() {
            let html = `
              <div class="section-header">
                <h4><i class="fas fa-box"></i> All Products (${products.length})</h4>
                <button class="add-btn" onclick="showAddProduct()"><i class="fas fa-plus"></i> Add</button>
              </div>
              <div id="productFormContainer"></div>
              <div id="productList">
            `;

            if (products.length === 0) {
                html += `<div class="empty-state"><i class="fas fa-box"></i><p>No products. Add your first product!</p></div>`;
            } else {
                products.forEach(p => {
                    html += `
                  <div class="admin-card">
                    <img src="${p.image || 'https://placehold.co/48x48/0f172a/white?text=P'}" class="thumb" />
                    <div class="info">
                      <div class="title">${p.name}</div>
                      <div class="sub">${p.category} • ${formatPrice(p.price)} ${p.discountPercent > 0 ? `• ${p.discountPercent}% OFF` : ''}</div>
                    </div>
                    <div class="actions">
                      <button class="edit-btn" onclick="editProduct('${p.id}')"><i class="fas fa-edit"></i></button>
                      <button class="delete-btn" onclick="deleteProduct('${p.id}')"><i class="fas fa-trash"></i></button>
                    </div>
                  </div>
                `;
                });
            }

            html += `
              </div>
              <div style="margin-top:16px;">
                <button class="danger-btn" onclick="deleteAllProducts()"><i class="fas fa-trash"></i> Delete All Products</button>
              </div>
            `;
            return html;
        }

        // ----- Add Product -----
        window.showAddProduct = function() {
            const container = document.getElementById('productFormContainer');
            container.innerHTML = `
              <div class="admin-form">
                <h4><i class="fas fa-plus-circle" style="color:#2563eb;"></i> Add New Product</h4>
                <div class="form-group">
                  <label>Product Name *</label>
                  <input type="text" id="prodName" placeholder="e.g. iPhone 15 Pro Max" />
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label>Price (₦) *</label>
                    <input type="number" id="prodPrice" placeholder="1200000" />
                  </div>
                  <div class="form-group">
                    <label>Original Price (₦) (optional)</label>
                    <input type="number" id="prodOriginal" placeholder="1400000" />
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label>Category *</label>
                    <select id="prodCategory">
                      <option value="Electronics">Electronics</option>
                      <option value="Phones">Phones</option>
                      <option value="Laptop">Laptop</option>
                      <option value="Fashion">Fashion</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label>Discount % (optional)</label>
                    <input type="number" id="prodDiscount" placeholder="10" min="0" max="100" />
                  </div>
                </div>
                <div class="form-group">
                  <label>Product Image URL *</label>
                  <input type="text" id="prodImage" placeholder="https://example.com/image.jpg" />
                </div>
                <div class="form-group">
                  <label>Description</label>
                  <textarea id="prodDesc" placeholder="Detailed product description..."></textarea>
                </div>
                <button class="submit-btn" onclick="saveProduct()"><i class="fas fa-save"></i> Save Product</button>
                <button class="cancel-btn" onclick="document.getElementById('productFormContainer').innerHTML=''">Cancel</button>
              </div>
            `;
            container.scrollIntoView({ behavior: 'smooth' });
        };

        window.saveProduct = async function() {
            const name = document.getElementById('prodName').value.trim();
            const price = parseFloat(document.getElementById('prodPrice').value);
            const originalPrice = parseFloat(document.getElementById('prodOriginal').value) || null;
            const category = document.getElementById('prodCategory').value;
            const discount = parseInt(document.getElementById('prodDiscount').value) || 0;
            const image = document.getElementById('prodImage').value.trim();
            const description = document.getElementById('prodDesc').value.trim();

            if (!name || !price || !image) {
                showToast('Please fill in all required fields (Name, Price, Image)', 'error');
                return;
            }

            try {
                await addProduct({ name, price, originalPrice, category, discountPercent: discount > 0 ? discount : 0, image, description: description || 'No description provided.' });
                document.getElementById('productFormContainer').innerHTML = '';
                await loadProducts();
                renderAdmin();
                showToast(`"${name}" added successfully!`, 'success');
            } catch {
                showToast('Error adding product. Please try again.', 'error');
            }
        };

        // ----- Edit Product -----
        window.editProduct = function(id) {
            const p = getProduct(id);
            if (!p) return;
            const container = document.getElementById('productFormContainer');
            container.innerHTML = `
              <div class="admin-form">
                <h4><i class="fas fa-edit" style="color:#2563eb;"></i> Edit Product</h4>
                <div class="form-group">
                  <label>Product Name *</label>
                  <input type="text" id="prodName" value="${p.name}" />
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label>Price (₦) *</label>
                    <input type="number" id="prodPrice" value="${p.price}" />
                  </div>
                  <div class="form-group">
                    <label>Original Price (₦) (optional)</label>
                    <input type="number" id="prodOriginal" value="${p.originalPrice || ''}" />
                  </div>
                </div>
                <div class="form-row">
                  <div class="form-group">
                    <label>Category *</label>
                    <select id="prodCategory">
                      <option value="Electronics" ${p.category === 'Electronics' ? 'selected' : ''}>Electronics</option>
                      <option value="Phones" ${p.category === 'Phones' ? 'selected' : ''}>Phones</option>
                      <option value="Laptop" ${p.category === 'Laptop' ? 'selected' : ''}>Laptop</option>
                      <option value="Fashion" ${p.category === 'Fashion' ? 'selected' : ''}>Fashion</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label>Discount % (optional)</label>
                    <input type="number" id="prodDiscount" value="${p.discountPercent || 0}" min="0" max="100" />
                  </div>
                </div>
                <div class="form-group">
                  <label>Product Image URL *</label>
                  <input type="text" id="prodImage" value="${p.image || ''}" />
                </div>
                <div class="form-group">
                  <label>Description</label>
                  <textarea id="prodDesc">${p.description || ''}</textarea>
                </div>
                <button class="submit-btn" onclick="updateProduct('${p.id}')"><i class="fas fa-save"></i> Update Product</button>
                <button class="cancel-btn" onclick="document.getElementById('productFormContainer').innerHTML=''">Cancel</button>
              </div>
            `;
            container.scrollIntoView({ behavior: 'smooth' });
        };

        window.updateProduct = async function(id) {
            const p = getProduct(id);
            if (!p) return;
            const name = document.getElementById('prodName').value.trim();
            const price = parseFloat(document.getElementById('prodPrice').value);
            const originalPrice = parseFloat(document.getElementById('prodOriginal').value) || null;
            const category = document.getElementById('prodCategory').value;
            const discount = parseInt(document.getElementById('prodDiscount').value) || 0;
            const image = document.getElementById('prodImage').value.trim();
            const description = document.getElementById('prodDesc').value.trim();

            if (!name || !price || !image) {
                showToast('Please fill in all required fields', 'error');
                return;
            }

            try {
                await updateProduct(id, { name, price, originalPrice, category, discountPercent: discount > 0 ? discount : 0, image, description: description || 'No description provided.' });
                document.getElementById('productFormContainer').innerHTML = '';
                await loadProducts();
                renderAdmin();
                showToast(`"${name}" updated successfully!`, 'success');
            } catch {
                showToast('Error updating product. Please try again.', 'error');
            }
        };

        // ----- Delete Product -----
        window.deleteProduct = async function(id) {
            const p = getProduct(id);
            if (!p) return;
            if (confirm(`Delete "${p.name}" permanently?`)) {
                try {
                    await deleteProduct(id);
                    await loadProducts();
                    renderAdmin();
                    showToast(`"${p.name}" deleted.`, 'info');
                } catch {
                    showToast('Error deleting product.', 'error');
                }
            }
        };

        // ----- Delete All Products -----
        window.deleteAllProducts = async function() {
            if (products.length === 0) { showToast('No products to delete.', 'info'); return; }
            if (confirm(`⚠️ Delete ALL ${products.length} products permanently?\n\nThis action cannot be undone!`)) {
                if (confirm(`Are you absolutely sure? This will remove ALL products from the store.`)) {
                    try {
                        await deleteAllProducts();
                        await loadProducts();
                        renderAdmin();
                        showToast('All products deleted!', 'info');
                    } catch {
                        showToast('Error deleting products.', 'error');
                    }
                }
            }
        };

        // ============================================================
        //  BANNERS TAB
        // ============================================================

        function renderBannersTab() {
            let html = `
              <div class="section-header">
                <h4><i class="fas fa-image"></i> Banners (${slides.length})</h4>
                <button class="add-btn" onclick="showAddBanner()"><i class="fas fa-plus"></i> Add</button>
              </div>
              <div id="bannerFormContainer"></div>
              <div id="bannerList">
            `;

            if (slides.length === 0) {
                html += `<div class="empty-state"><i class="fas fa-image"></i><p>No banners. Add your first banner!</p></div>`;
            } else {
                slides.forEach((slide) => {
                    const imageUrl = slide.image || slide;
                    const altText = slide.alt || 'Banner';
                    html += `
                  <div class="admin-card">
                    <img src="${imageUrl}" class="thumb" />
                    <div class="info">
                      <div class="title">${altText}</div>
                      <div class="sub">Slide</div>
                    </div>
                    <div class="actions">
                      <button class="edit-btn" onclick="editBanner('${slide.id}')"><i class="fas fa-edit"></i></button>
                      <button class="delete-btn" onclick="deleteBanner('${slide.id}')"><i class="fas fa-trash"></i></button>
                    </div>
                  </div>
                `;
                });
            }

            html += `
              </div>
              <div style="margin-top:16px;">
                <button class="danger-btn" onclick="deleteAllBanners()"><i class="fas fa-trash"></i> Delete All Banners</button>
              </div>
            `;
            return html;
        }

        // ----- Add Banner -----
        window.showAddBanner = function() {
            const container = document.getElementById('bannerFormContainer');
            container.innerHTML = `
              <div class="admin-form">
                <h4><i class="fas fa-plus-circle" style="color:#2563eb;"></i> Add Banner Slide</h4>
                <div class="form-group">
                  <label>Banner Image URL *</label>
                  <input type="text" id="bannerImage" placeholder="https://example.com/banner.jpg" />
                </div>
                <div class="form-group">
                  <label>Alt Text (optional)</label>
                  <input type="text" id="bannerAlt" placeholder="Brief description of the banner" />
                </div>
                <button class="submit-btn" onclick="saveBanner()"><i class="fas fa-save"></i> Add Banner</button>
                <button class="cancel-btn" onclick="document.getElementById('bannerFormContainer').innerHTML=''">Cancel</button>
              </div>
            `;
            container.scrollIntoView({ behavior: 'smooth' });
        };

        window.saveBanner = async function() {
            const image = document.getElementById('bannerImage').value.trim();
            const alt = document.getElementById('bannerAlt').value.trim() || 'Banner';
            if (!image) { showToast('Please enter a banner image URL', 'error'); return; }
            try {
                await addSlide({ image, alt });
                document.getElementById('bannerFormContainer').innerHTML = '';
                await loadSlides();
                renderAdmin();
                showToast('Banner added!', 'success');
            } catch {
                showToast('Error adding banner.', 'error');
            }
        };

        // ----- Edit Banner -----
        window.editBanner = function(id) {
            const slide = slides.find(s => s.id === id);
            if (!slide) return;
            const container = document.getElementById('bannerFormContainer');
            container.innerHTML = `
              <div class="admin-form">
                <h4><i class="fas fa-edit" style="color:#2563eb;"></i> Edit Banner</h4>
                <div class="form-group">
                  <label>Banner Image URL *</label>
                  <input type="text" id="bannerImage" value="${slide.image || ''}" />
                </div>
                <div class="form-group">
                  <label>Alt Text (optional)</label>
                  <input type="text" id="bannerAlt" value="${slide.alt || ''}" />
                </div>
                <button class="submit-btn" onclick="updateBanner('${slide.id}')"><i class="fas fa-save"></i> Update Banner</button>
                <button class="cancel-btn" onclick="document.getElementById('bannerFormContainer').innerHTML=''">Cancel</button>
              </div>
            `;
            container.scrollIntoView({ behavior: 'smooth' });
        };

        window.updateBanner = async function(id) {
            const image = document.getElementById('bannerImage').value.trim();
            const alt = document.getElementById('bannerAlt').value.trim() || 'Banner';
            if (!image) { showToast('Please enter a banner image URL', 'error'); return; }
            try {
                await updateSlide(id, { image, alt });
                document.getElementById('bannerFormContainer').innerHTML = '';
                await loadSlides();
                renderAdmin();
                showToast('Banner updated!', 'success');
            } catch {
                showToast('Error updating banner.', 'error');
            }
        };

        // ----- Delete Banner -----
        window.deleteBanner = async function(id) {
            if (slides.length <= 1) { showToast('You must keep at least one banner.', 'error'); return; }
            if (confirm(`Delete this banner slide?`)) {
                try {
                    await deleteSlide(id);
                    await loadSlides();
                    renderAdmin();
                    showToast('Banner deleted.', 'info');
                } catch {
                    showToast('Error deleting banner.', 'error');
                }
            }
        };

        // ----- Delete All Banners -----
        window.deleteAllBanners = async function() {
            if (slides.length === 0) { showToast('No banners to delete.', 'info'); return; }
            if (confirm(`⚠️ Delete ALL ${slides.length} banners permanently?\n\nThis action cannot be undone!`)) {
                if (confirm(`Are you absolutely sure? This will remove ALL banners.`)) {
                    try {
                        await deleteAllSlides();
                        await loadSlides();
                        renderAdmin();
                        showToast('All banners deleted!', 'info');
                    } catch {
                        showToast('Error deleting banners.', 'error');
                    }
                }
            }
        };

        // ============================================================
        //  LOAD DATA FUNCTIONS
        // ============================================================

        async function loadProducts() { products = await getProducts(); }
        async function loadSlides() { slides = await getSlides(); }

        async function loadAllData() {
            try {
                isLoading = true;
                await loadProducts();
                await loadSlides();
                isLoading = false;
            } catch {
                isLoading = false;
                showToast('Error loading data. Please refresh.', 'error');
            }
        }

        // ============================================================
        //  TAB SWITCHING
        // ============================================================

        window.switchTab = function(tab) {
            currentTab = tab;
            renderAdmin();
        };

        // ============================================================
        //  LOGIN / LOGOUT
        // ============================================================

        window.login = async function() {
            const input = document.getElementById('adminLoginInput');
            const error = document.getElementById('loginError');
            if (input.value === ADMIN_PASSWORD) {
                isLoggedIn = true;
                await loadAllData();
                renderAdmin();
                showToast('Welcome Admin!', 'success');
            } else {
                error.style.display = 'block';
                input.value = '';
                setTimeout(() => { error.style.display = 'none'; }, 2000);
            }
        };

        window.logout = function() {
            isLoggedIn = false;
            renderAdmin();
            showToast('Logged out', 'info');
        };

        // ============================================================
        //  INIT
        // ============================================================

        function init() {
            renderAdmin();
            window.products = products;
            window.slides = slides;
            window.showAddProduct = showAddProduct;
            window.saveProduct = saveProduct;
            window.editProduct = editProduct;
            window.updateProduct = updateProduct;
            window.deleteProduct = deleteProduct;
            window.deleteAllProducts = deleteAllProducts;
            window.showAddBanner = showAddBanner;
            window.saveBanner = saveBanner;
            window.editBanner = editBanner;
            window.updateBanner = updateBanner;
            window.deleteBanner = deleteBanner;
            window.deleteAllBanners = deleteAllBanners;
            window.switchTab = switchTab;
            window.login = login;
            window.logout = logout;
        }

        init();
    </script>

</body>
</html>
