<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PGE Shop - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* === ALL STYLES SAME AS BEFORE === */
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --primary: #f5b400;
            --dark: #101828;
            --text: #172033;
            --muted: #667085;
            --bg: #f7f8fa;
            --card: #ffffff;
            --border: #eaecf0;
            --green: #16a34a;
            --red: #ef4444;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            padding-bottom: 80px;
        }
        #authOverlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 20px;
        }
        .auth-card {
            background: #fff;
            padding: 32px 24px;
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 360px;
            text-align: center;
            border: 1px solid var(--border);
        }
        .auth-card h2 {
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 800;
        }
        .auth-card h2 i { color: var(--primary); }
        .auth-card input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 16px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .auth-card input:focus { border-color: var(--primary); }
        .auth-card button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: var(--dark);
            border: none;
            border-radius: 12px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .auth-card button:active { transform: scale(0.96); }
        .auth-error {
            color: var(--red);
            font-size: 13px;
            margin-top: 12px;
            font-weight: 600;
            display: none;
        }
        .admin-header {
            background: var(--dark);
            color: #fff;
            padding: 16px 20px;
            border-radius: 16px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .admin-header h1 {
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .admin-header h1 i { color: var(--primary); }
        .admin-header a {
            color: var(--primary);
            font-weight: 700;
            font-size: 13px;
            text-decoration: none;
        }
        .admin-header a:hover { text-decoration: underline; }
        .admin-section {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
        }
        .admin-section h2 {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .admin-section h2 i { color: var(--primary); }
        .btn {
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 12px;
            border: none;
            cursor: pointer;
            transition: transform 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:active { transform: scale(0.95); }
        .btn-primary { background: var(--primary); color: var(--dark); }
        .btn-success { background: var(--green); color: #fff; }
        .btn-danger { background: var(--red); color: #fff; }
        .btn-secondary { background: var(--border); color: var(--text); }
        .btn-sm { padding: 4px 10px; font-size: 10px; }
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--muted);
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: inherit;
            font-size: 13px;
            background: #fff;
            transition: border-color 0.2s;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary);
        }
        .form-group textarea { resize: vertical; min-height: 60px; }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8fafc;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
            cursor: pointer;
        }
        .checkbox-group input {
            width: 18px;
            height: 18px;
            accent-color: var(--red);
            cursor: pointer;
        }
        .checkbox-group label {
            margin: 0;
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
        }
        .table-responsive { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        table th {
            text-align: left;
            padding: 10px 8px;
            background: var(--bg);
            font-weight: 700;
            border-bottom: 2px solid var(--border);
        }
        table td {
            padding: 10px 8px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        table td img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 6px;
        }
        .actions { display: flex; gap: 4px; flex-wrap: wrap; }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 9px;
            font-weight: 700;
            background: var(--bg);
            color: var(--muted);
        }
        .badge-sold { background: #fee2e2; color: var(--red); }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(16, 24, 40, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-overlay.show { display: flex; }
        .modal-card {
            background: #fff;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            position: relative;
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-card h3 {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 16px;
        }
        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--bg);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 14px;
            cursor: pointer;
        }
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--dark);
            color: #fff;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 12px;
            z-index: 2000;
            display: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }
        .toast.show {
            display: block;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from { transform: translateX(-50%) translateY(20px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }
        .empty-state {
            text-align: center;
            padding: 30px 20px;
            color: var(--muted);
        }
        .empty-state i {
            font-size: 32px;
            margin-bottom: 8px;
            color: #d0d5dd;
        }
        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; }
            .admin-header { flex-direction: column; align-items: stretch; text-align: center; }
        }
    </style>
</head>
<body>

    <!-- AUTH OVERLAY -->
    <div id="authOverlay">
        <div class="auth-card">
            <h2><i class="fa-solid fa-lock"></i> Admin Locked</h2>
            <input type="password" id="adminPasswordInput" placeholder="Enter security password" onkeypress="if(event.key === 'Enter') verifyAdmin()">
            <button onclick="verifyAdmin()"><i class="fa-solid fa-unlock"></i> Unlock Dashboard</button>
            <div id="authErrorMsg" class="auth-error">Incorrect password. Access denied.</div>
        </div>
    </div>

    <!-- HEADER -->
    <div class="admin-header">
        <h1><i class="fa-solid fa-crown"></i> PGE Shop Admin</h1>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
            <a href="#" onclick="exportData()"><i class="fa-solid fa-download"></i> Export</a>
            <a href="#" onclick="importData()"><i class="fa-solid fa-upload"></i> Import</a>
            <a href="index.html" target="_blank"><i class="fa-solid fa-eye"></i> View Store</a>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="toast"></div>

    <!-- BANNERS -->
    <div class="admin-section">
        <h2><i class="fa-solid fa-image"></i> Manage Banners</h2>
        <button class="btn btn-primary" onclick="openBannerModal()"><i class="fa-solid fa-plus"></i> Add Banner</button>
        <div style="margin-top:12px;">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr><th>Image</th><th>Label</th><th>Title</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="bannerTableBody">
                        <tr><td colspan="4"><div class="empty-state"><p>Loading...</p></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- PRODUCTS -->
    <div class="admin-section">
        <h2><i class="fa-solid fa-box"></i> Manage Products</h2>
        <button class="btn btn-primary" onclick="openProductModal()"><i class="fa-solid fa-plus"></i> Add Product</button>
        <div style="margin-top:12px;">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Status</th><th>Actions</th></tr>
                    </thead>
                    <tbody id="productTableBody">
                        <tr><td colspan="6"><div class="empty-state"><p>Loading...</p></div></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- BANNER MODAL -->
    <div id="bannerModal" class="modal-overlay">
        <div class="modal-card">
            <button class="modal-close" onclick="closeModal('bannerModal')"><i class="fa-solid fa-xmark"></i></button>
            <h3 id="bannerModalTitle">Add Banner</h3>
            <form id="bannerForm" onsubmit="saveBanner(event)">
                <input type="hidden" id="bannerEditId">
                <input type="hidden" id="bannerImageUrl">
                <div class="form-group">
                    <label>Upload Banner Image (from Phone/Laptop)</label>
                    <input type="file" id="bannerFile" accept="image/*" onchange="previewImage(this, 'bannerPreview', 'bannerImageUrl')">
                    <div style="margin-top:8px;">
                        <img id="bannerPreview" style="max-width:100px; max-height:60px; object-fit:cover; border-radius:6px; display:none;" alt="Preview">
                    </div>
                </div>
                <div class="form-group">
                    <label>Or Image URL</label>
                    <input type="url" id="bannerImageAlt" placeholder="https://..." oninput="document.getElementById('bannerImageUrl').value = this.value; document.getElementById('bannerPreview').src = this.value; document.getElementById('bannerPreview').style.display = this.value ? 'block':'none';">
                </div>
                <div class="form-group">
                    <label>Label (e.g., Electronics Deal)</label>
                    <input type="text" id="bannerLabel" placeholder="Electronics Deal">
                </div>
                <div class="form-group">
                    <label>Title (e.g., Upgrade Your Lifestyle)</label>
                    <input type="text" id="bannerTitle" placeholder="Upgrade Your Lifestyle">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" id="bannerDesc" placeholder="Discover quality electronics...">
                </div>
                <div class="form-group">
                    <label>Button Text (e.g., Shop Electronics)</label>
                    <input type="text" id="bannerBtnText" placeholder="Shop Electronics">
                </div>
                <div class="form-group">
                    <label>Button Category (e.g., Electronics)</label>
                    <input type="text" id="bannerBtnCategory" placeholder="Electronics">
                </div>
                <button type="submit" class="btn btn-success" style="width:100%;justify-content:center;padding:12px;">
                    <i class="fa-solid fa-save"></i> Save Banner
                </button>
            </form>
        </div>
    </div>

    <!-- PRODUCT MODAL -->
    <div id="productModal" class="modal-overlay">
        <div class="modal-card">
            <button class="modal-close" onclick="closeModal('productModal')"><i class="fa-solid fa-xmark"></i></button>
            <h3 id="productModalTitle">Add Product</h3>
            <form id="productForm" onsubmit="saveProduct(event)">
                <input type="hidden" id="productEditId">
                <input type="hidden" id="productImageUrl">
                <div class="form-group">
                    <label>Product Name *</label>
                    <input type="text" id="productName" required placeholder="Smart 4K Ultra HD TV 55&quot;">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Price (₦) *</label>
                        <input type="number" id="productPrice" required placeholder="320000">
                    </div>
                    <div class="form-group">
                        <label>Discount %</label>
                        <input type="number" id="productDiscount" placeholder="15" min="0" max="100">
                    </div>
                </div>
                <div class="form-group">
                    <label>Category *</label>
                    <select id="productCategory" required>
                        <option value="Electronics">Electronics</option>
                        <option value="Phones">Phones</option>
                        <option value="Laptop">Laptop</option>
                        <option value="Fashion">Fashion</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Description *</label>
                    <textarea id="productDesc" required placeholder="Crystal clear 4K display..."></textarea>
                </div>
                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="productSoldOut">
                        <label for="productSoldOut">Mark as Sold Out (Disables Cart & Details)</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Upload Product Image (from Phone/Laptop)</label>
                    <input type="file" id="productFile" accept="image/*" onchange="previewImage(this, 'productPreview', 'productImageUrl')">
                    <div style="margin-top:8px;">
                        <img id="productPreview" style="max-width:80px; max-height:80px; object-fit:cover; border-radius:6px; display:none;" alt="Preview">
                    </div>
                </div>
                <div class="form-group">
                    <label>Or Image URL</label>
                    <input type="url" id="productImageAlt" placeholder="https://..." oninput="document.getElementById('productImageUrl').value = this.value; document.getElementById('productPreview').src = this.value; document.getElementById('productPreview').style.display = this.value ? 'block':'none';">
                </div>
                <button type="submit" class="btn btn-success" style="width:100%;justify-content:center;padding:12px;">
                    <i class="fa-solid fa-save"></i> Save Product
                </button>
            </form>
        </div>
    </div>

    <script>
        // =============================================
        // AUTH
        // =============================================
        const ADMIN_SECURE_PASSWORD = 'admin5677*#*#@';
        const INACTIVITY_LIMIT_MS = 60000;
        let isAppUnlocked = false;
        let inactivityTimer;

        function verifyAdmin() {
            const inputVal = document.getElementById('adminPasswordInput').value;
            if (inputVal === ADMIN_SECURE_PASSWORD) {
                document.getElementById('authOverlay').style.display = 'none';
                document.getElementById('authErrorMsg').style.display = 'none';
                document.getElementById('adminPasswordInput').value = '';
                isAppUnlocked = true;
                resetInactivityTimer();
                if(banners.length === 0 && products.length === 0) fetchData();
            } else {
                document.getElementById('authErrorMsg').style.display = 'block';
            }
        }

        function lockDashboard() {
            document.getElementById('authOverlay').style.display = 'flex';
            isAppUnlocked = false;
            clearTimeout(inactivityTimer);
        }

        function resetInactivityTimer() {
            if (!isAppUnlocked) return;
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(lockDashboard, INACTIVITY_LIMIT_MS);
        }

        ['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(evt => {
            document.addEventListener(evt, resetInactivityTimer);
        });
        document.addEventListener('visibilitychange', () => { if (document.hidden) lockDashboard(); });
        lockDashboard();

        // =============================================
        // SUPABASE INIT
        // =============================================
        const { createClient } = supabase;
        const supabaseUrl = 'https://puswrhvjnxrgakyobres.supabase.co';
        const supabaseKey = 'sb_publishable_IYOKqT4SfzVyyOBqkMPL2Q_jtPs92a0';
        const _supabase = createClient(supabaseUrl, supabaseKey);

        let banners = [];
        let products = [];

        // =============================================
        // FETCH DATA
        // =============================================
        async function fetchData() {
            try {
                const { data: bData, error: bErr } = await _supabase.from('banners').select('*').order('id', { ascending: true });
                if (bErr) throw bErr;
                banners = bData || [];

                const { data: pData, error: pErr } = await _supabase.from('products').select('*').order('id', { ascending: true });
                if (pErr) throw pErr;
                products = pData || [];

                renderBanners();
                renderProducts();
            } catch (error) {
                showToast('Error loading data: ' + error.message);
                console.error(error);
            }
        }

        // =============================================
        // FILE UPLOAD
        // =============================================
        async function uploadImageFile(fileInputId) {
            const fileInput = document.getElementById(fileInputId);
            if (!fileInput || !fileInput.files || fileInput.files.length === 0) return null;
            const file = fileInput.files[0];
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 9)}.${fileExt}`;
            const filePath = `store_uploads/${fileName}`;

            try {
                const { error: uploadError } = await _supabase.storage.from('products').upload(filePath, file);
                if (uploadError) {
                    console.error("Storage upload error:", uploadError);
                    return await convertFileToBase64(file);
                }
                const { data } = _supabase.storage.from('products').getPublicUrl(filePath);
                return data.publicUrl;
            } catch (e) {
                console.error("Upload exception, using base64 fallback", e);
                return await convertFileToBase64(file);
            }
        }

        function convertFileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function previewImage(input, previewId, urlFieldId) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById(previewId);
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    document.getElementById(urlFieldId).value = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        // =============================================
        // RENDER
        // =============================================
        function renderBanners() {
            const tbody = document.getElementById('bannerTableBody');
            if (!banners || banners.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4"><div class="empty-state"><i class="fa-solid fa-image"></i><p>No banners added yet</p></div></td></tr>`;
                return;
            }
            tbody.innerHTML = banners.map(b => `
                <tr>
                    <td><img src="${b.image || ''}" alt="${b.label || 'Banner'}" onerror="this.src='https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?w=1200&q=80'"></td>
                    <td><strong>${b.label || '-'}</strong></td>
                    <td>${b.title || '-'}</td>
                    <td>
                        <div class="actions">
                            <button class="btn btn-primary btn-sm" onclick="editBanner(${b.id})"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn btn-danger btn-sm" onclick="deleteBanner(${b.id})"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function renderProducts() {
            const tbody = document.getElementById('productTableBody');
            if (!products || products.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state"><i class="fa-solid fa-box-open"></i><p>No products added yet</p></div></td></tr>`;
                return;
            }
            tbody.innerHTML = products.map(p => `
                <tr>
                    <td><img src="${p.image || ''}" alt="${p.name}" onerror="this.src='https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=700&q=85'"></td>
                    <td><strong>${p.name}</strong></td>
                    <td><span class="badge">${p.category}</span></td>
                    <td>₦${p.price ? p.price.toLocaleString() : 0}</td>
                    <td>${p.is_sold_out ? '<span class="badge badge-sold">Sold Out</span>' : '<span class="badge" style="background:#dcfce7;color:#16a34a;">Available</span>'}</td>
                    <td>
                        <div class="actions">
                            <button class="btn btn-primary btn-sm" onclick="editProduct(${p.id})"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn btn-danger btn-sm" onclick="deleteProduct(${p.id})"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // =============================================
        // BANNER CRUD (FIXED: lowercase column names)
        // =============================================
        function openBannerModal(data) {
            document.getElementById('bannerModal').classList.add('show');
            document.getElementById('bannerFile').value = '';
            document.getElementById('bannerPreview').style.display = 'none';
            if (data) {
                document.getElementById('bannerModalTitle').textContent = 'Edit Banner';
                document.getElementById('bannerEditId').value = data.id;
                document.getElementById('bannerLabel').value = data.label || '';
                document.getElementById('bannerTitle').value = data.title || '';
                document.getElementById('bannerDesc').value = data.desc || '';
                document.getElementById('bannerBtnText').value = data.btntext || '';   // lowercase
                document.getElementById('bannerBtnCategory').value = data.btncategory || ''; // lowercase
                document.getElementById('bannerImageUrl').value = data.image || '';
                document.getElementById('bannerImageAlt').value = '';
                if(data.image) {
                    const prev = document.getElementById('bannerPreview');
                    prev.src = data.image;
                    prev.style.display = 'block';
                }
            } else {
                document.getElementById('bannerModalTitle').textContent = 'Add Banner';
                document.getElementById('bannerEditId').value = '';
                document.getElementById('bannerImageUrl').value = '';
                document.getElementById('bannerImageAlt').value = '';
                document.getElementById('bannerForm').reset();
            }
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        async function saveBanner(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const ogText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Uploading & Saving...';
            btn.disabled = true;

            try {
                let imageUrl = document.getElementById('bannerImageUrl').value;
                const uploadedUrl = await uploadImageFile('bannerFile');
                if (uploadedUrl) {
                    imageUrl = uploadedUrl;
                }

                if (!imageUrl) {
                    showToast('Please provide an image or upload a file.');
                    btn.innerHTML = ogText;
                    btn.disabled = false;
                    return;
                }

                const id = document.getElementById('bannerEditId').value;
                // lowercase column names!
                const data = {
                    label: document.getElementById('bannerLabel').value || null,
                    title: document.getElementById('bannerTitle').value || null,
                    desc: document.getElementById('bannerDesc').value || null,
                    btntext: document.getElementById('bannerBtnText').value || null,
                    btncategory: document.getElementById('bannerBtnCategory').value || null,
                    image: imageUrl,
                };

                console.log('Saving banner data:', data); // debug

                let result;
                if (id) {
                    result = await _supabase.from('banners').update(data).eq('id', id);
                } else {
                    result = await _supabase.from('banners').insert([data]);
                }

                if (result.error) {
                    throw result.error;
                }

                showToast(id ? 'Banner updated successfully!' : 'Banner added successfully!');
                await fetchData();
                closeModal('bannerModal');
            } catch (err) {
                showToast('Error saving banner: ' + err.message);
                console.error(err);
            } finally {
                btn.innerHTML = ogText;
                btn.disabled = false;
            }
        }

        function editBanner(id) {
            const banner = banners.find(b => b.id === id);
            if (banner) openBannerModal(banner);
        }

        async function deleteBanner(id) {
            if (!confirm('Delete this banner?')) return;
            try {
                const { error } = await _supabase.from('banners').delete().eq('id', id);
                if (error) throw error;
                await fetchData();
                showToast('Banner deleted!');
            } catch(e) {
                showToast('Error deleting banner: ' + e.message);
            }
        }

        // =============================================
        // PRODUCT CRUD (unchanged, works)
        // =============================================
        function openProductModal(data) {
            document.getElementById('productModal').classList.add('show');
            document.getElementById('productFile').value = '';
            document.getElementById('productPreview').style.display = 'none';
            if (data) {
                document.getElementById('productModalTitle').textContent = 'Edit Product';
                document.getElementById('productEditId').value = data.id;
                document.getElementById('productName').value = data.name || '';
                document.getElementById('productPrice').value = data.price || '';
                document.getElementById('productDiscount').value = data.discount || '';
                document.getElementById('productCategory').value = data.category || 'Electronics';
                document.getElementById('productDesc').value = data.desc || '';
                document.getElementById('productSoldOut').checked = data.is_sold_out === true;
                document.getElementById('productImageUrl').value = data.image || '';
                document.getElementById('productImageAlt').value = '';
                if(data.image) {
                    const prev = document.getElementById('productPreview');
                    prev.src = data.image;
                    prev.style.display = 'block';
                }
            } else {
                document.getElementById('productModalTitle').textContent = 'Add Product';
                document.getElementById('productEditId').value = '';
                document.getElementById('productImageUrl').value = '';
                document.getElementById('productImageAlt').value = '';
                document.getElementById('productForm').reset();
                document.getElementById('productSoldOut').checked = false;
            }
        }

        async function saveProduct(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const ogText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Uploading & Saving...';
            btn.disabled = true;

            try {
                let imageUrl = document.getElementById('productImageUrl').value;
                const uploadedUrl = await uploadImageFile('productFile');
                if (uploadedUrl) {
                    imageUrl = uploadedUrl;
                }

                if (!imageUrl) {
                    showToast('Please provide an image or upload a file.');
                    btn.innerHTML = ogText;
                    btn.disabled = false;
                    return;
                }

                const id = document.getElementById('productEditId').value;
                const data = {
                    name: document.getElementById('productName').value,

                };

                    result = await _supabase.from('products').update(data).eq('id', id);

                if (result.error) throw result.error;

                closeModal('productModal');
            } catch (err) {

        function editProduct(id) {
            const product = products.find(p => p.id === id);
            if (product) openProductModal(product);
        }

        async function deleteProduct(id) {
            if (!confirm('Delete this product?')) return;
            try {
                const { error } = await _supabase.from('products').delete().eq('id', id);
                if (error) throw error;
                await fetchData();
                showToast('Product deleted!');
            } catch (e) {
                showToast('Error deleting product: ' + e.message);
            }
        }

        // =============================================
        // EXPORT / IMPORT
        // =============================================
        function exportData() {
            const data = { banners, products, exportedAt: new Date().toISOString() };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `pge_shop_data_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('Data exported!');
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = async function(e) {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async function(ev) {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (data.banners && data.products) {
                            if (confirm('This will insert new data to Supabase. Continue?')) {
                                const cleanBanners = data.banners.map(({id, ...rest}) => rest);
                                const cleanProducts = data.products.map(({id, ...rest}) => rest);
                                const { error: bErr } = await _supabase.from('banners').insert(cleanBanners);
                                if (bErr) throw bErr;
                                const { error: pErr } = await _supabase.from('products').insert(cleanProducts);
                                if (pErr) throw pErr;
                                await fetchData();
                                showToast('Data imported successfully!');
                            }
                        } else {
                            showToast('Invalid data format!');
                        }
                    } catch (err) {
                        showToast('Error importing: ' + err.message);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // =============================================
        // TOAST
        // =============================================
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 3000);
        }

        document.querySelectorAll('.modal-overlay').forEach(el => {
            el.addEventListener('click', function(e) {
                if (e.target === this) this.classList.remove('show');
            });
        });

        // =============================================
        // INIT
        // =============================================
        fetchData();
    </script>
</body>
